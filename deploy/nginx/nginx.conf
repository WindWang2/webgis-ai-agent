# ============================================================
# WebGIS AI Agent 生产环境 Nginx 配置
# 支持 HTTPS、静态资源缓存、API 路由转发、CORS 处理
# ============================================================

# 运行用户
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # CORS allow-list: only echo approved origins
    map $http_origin $allowed_origin {
        default "";
        "~^https://your-domain\.com$" $http_origin;
        "~^https://www\.your-domain\.com$" $http_origin;
        "~^http://localhost:" $http_origin;
    }

    # Connection upgrade map (transport goal E-F-7/E-F-8): canonical nginx
    # pattern so non-upgrade requests keep upstream connections reusable.
    # Without this, every proxied request opened a fresh TCP connection to
    # uvicorn/node (the `keepalive 32/16` directives were a no-op because no
    # location ever cleared the Connection header, and `location /` hard-coded
    # `Connection 'upgrade'` for all frontend traffic).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # #757: WS 位置专用 —— $request_no_query 把请求行里的 query string 剥掉，
    # 防止 ?token=<JWT> 随 $request 写入访问日志。
    map $request $request_no_query {
        "~^(?<req_method>[^ ]+) (?<req_path>[^ ?]+)\?[^\ ]* (?<req_ver>HTTP/[^ ]+)$" "$req_method $req_path $req_ver";
        default $request;
    }
    log_format ws_no_query '$remote_addr - $remote_user [$time_local] "$request_no_query" '
                           '$status $body_bytes_sent "$http_referer" '
                           '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # 性能优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/rss+xml application/atom+xml image/svg+xml;

    # 上游服务
    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    upstream frontend_backend {
        server api:3000;
        keepalive 16;
    }

    # ======== HTTP 服务器 ========
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ======== HTTPS 服务器 ========
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL 证书配置（使用自签名证书示例）
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # SSL 安全配置
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # 安全头
        server_tokens off;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' ws: wss:" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ======== 请求体大小上限（全局基线） ========
        # #586：client_max_body_size 此前只设在 location /api/v1/upload（100M），
        # /api/v1/export（应用侧上限 50MB）/export/pdf/skills/upload 落入
        # location /api/ 的 nginx 内置默认 1M —— 高清导出图在传输层就 413。
        # server 级全局基线与应用侧各路由上限对齐；/upload 的显式值保留作冗余。
        client_max_body_size 100M;

        # ======== 静态资源缓存（顶层 regex 匹配，必须在 location / 之前）========
        # 审计 P0：之前嵌套在 location / 内的 location ~* 被 nginx 忽略（嵌套
        # regex location 无效），导致静态资源永不过期缓存未生效。提取到 server 顶层。
        # #585：regex location 匹配优先级高于普通前缀 location /api/（/api/ 无
        # ^~ 修饰），任何以这些扩展名结尾的 API URI（导出下载 /api/v1/export/
        # download/*.png、静态文件 /api/v1/static/*）会被劫持到 frontend 404。
        # 用负向前瞻 ^(?!/api/) 把 /api/ 前缀排除在静态缓存外，交给 API 路由。

        # JS / CSS — 1 年强缓存
        location ~* ^(?!/api/).*\.(js|css)$ {
            proxy_pass http://frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # 图片 / 字体 / SVG — 1 年强缓存（#585：负向前瞻排除 /api/，见上文）
        location ~* ^(?!/api/).*\.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ======== 前端（SPA + Next.js standalone server）========
        # 不匹配上述 regex 的请求全部转发给 Node.js standalone server。
        location / {
            proxy_pass http://frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # ======== API 路由 ========
        location /api/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 超时配置（transport goal E-F-5）：普通 API 调用也可能较重
            # （报告生成、重型工具 dispatch、非流式 /chat），60s 会把合法长
            # 调用 504。提升到 300s（与 upload 一致）。SSE 流有独立 location
            # 用 3600s。
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # CORS 头
            add_header Access-Control-Allow-Origin $allowed_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;
            # 安全头（nginx add_header 会覆盖父级，必须重复）
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;

            # 处理预检请求
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # ======== SSE 流式端点（必须在 /api/ 之前匹配） ========
        # proxy_buffering 默认开启会把 SSE chunk 攒在 nginx 缓冲区里再批量下发，
        # 用户感受到的是"卡顿 + 一次性涌出"。关闭后才能逐 chunk 转发。
        location = /api/v1/chat/stream {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 关键：SSE 必须关闭缓冲
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            add_header X-Accel-Buffering no;

            # 长连接：工具链可能跑数分钟
            proxy_connect_timeout 10s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }

        # ======== Explorer SSE 流（transport goal E-F-1，P0 修复） ========
        # 之前的 regex `^/api/v1/stream/` 匹配不到任何真实路由（实际路由是
        # /api/v1/explorer/stream/{task_id}，explorer.py:15,90），导致 explorer
        # 的进度流落到 `location /api/`：proxy_buffering 默认 ON（chunk 攒到
        # ~32KB 才下发）+ proxy_read_timeout 60s（空闲>60s 直接 504）。修正为
        # 匹配真实路径，并同样关闭缓冲 / 拉长超时。
        location ~ ^/api/v1/explorer/stream/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            add_header X-Accel-Buffering no;

            proxy_connect_timeout 10s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }

        # ======== 上传文件 ========
        location /api/v1/upload {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # 大文件上传配置
            client_max_body_size 100M;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # ======== WebSocket 支持 ========
        # #757: WS 握手 URL 可能携带 ?token=<JWT>（兼容回退），$request 含
        # 完整 query —— 用去掉 query 的请求行记录，避免活体 JWT 落盘。
        location /ws/ {
            access_log /var/log/nginx/access.log ws_no_query;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
        }

        # ======== 健康检查端点 ========
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ======== 错误页面 ========
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
