global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        # #1636：targets 此前为空列表 —— alerts-rules.json 全部 14 条规则会被
        # 加载并在 Prometheus UI 可见，但没有任何 receiver，生产故障时告警
        # 静默（只能人工翻看 UI 才发现）。改为占位目标 alertmanager:9093：
        # alertmanager 服务尚未部署，Prometheus 会持续记录投递失败（error
        # log 可见）而非静默丢弃；运维上线 alertmanager（compose override
        # 增补服务或独立部署）并配置 receiver 后投递自动生效 —— rule_files
        # 与规则本身无需任何改动。
        - targets: ['alertmanager:9093']

# 加载仓库内已跟踪的告警规则（deploy/alerts-rules.json，compose 中挂载）。
# #473：规则表达式引用的指标与下面的 scrape job 一一对应 ——
# tests/test_alerts_metrics_consistency.py 会在 CI 里校验这种对应关系，
# 引用无数据源指标的规则会让构建失败。
rule_files:
  - /etc/prometheus/alerts-rules.json

scrape_configs:
  # Prometheus 自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # WebGIS API 服务监控（审计 I11：path 改为 /metrics 匹配 prometheus-fastapi-instrumentator 默认）
  - job_name: 'webgis-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    scrape_interval: 30s
    # audit ISSUE-067（#1349）：/metrics 已 fail-closed（METRICS_TOKEN
    # Bearer 门禁，未配置即 401）——scrape 必须携带同一 token，否则
    # 生产监控静默失明。token 以 credentials_file 分发：部署时把
    # METRICS_TOKEN 值写入该文件（prometheus.yml 不做 env 展开，
    # 这是官方唯一的密钥注入缝）。文件内容 = 单行 token，无引号。
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics_token

  # PostgreSQL exporter（#473：pg_up 的数据源，Database_Connection_Failure 告警）。
  # 服务定义在 docker-compose.prod*.yml 的 postgres-exporter。
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Redis exporter（#473：redis_memory_* 与 redis_key_size 的数据源，
  # Redis_Memory_High / Celery_Task_Backlog 告警）。check-keys=celery 让
  # exporter 额外导出 celery 默认队列（Redis list key "celery"）的长度。
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # Node exporter（#473：node_filesystem_* 的数据源，Disk_Space_Low 告警）。
  # 只读挂载宿主 /proc /sys /，监控宿主机（容器所在物理机）的磁盘/负载。
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
