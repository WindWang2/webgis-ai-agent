global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        # 告警投递需要 alertmanager 服务（尚未部署）；规则仍会被加载并在
        # Prometheus UI 中可见。
        - targets: []

# 加载仓库内已跟踪的告警规则（deploy/alerts-rules.json，compose 中挂载）。
rule_files:
  - /etc/prometheus/alerts-rules.json

scrape_configs:
  # Prometheus 自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # WebGIS API 服务监控（审计 I11：path 改为 /metrics 匹配 prometheus-fastapi-instrumentator 默认）
  - job_name: 'webgis-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Redis 监控（需要 redis_exporter）
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']

  # Node Exporter（宿主机器指标）
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['node-exporter:9100']