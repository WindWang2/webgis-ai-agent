# Redis configuration for the secure production stack.
# Mounted into the container at /usr/local/etc/redis/redis.conf and loaded
# via `redis-server /usr/local/etc/redis/redis.conf`. Using a config file
# (instead of CLI args) sidesteps a docker-compose list-form `command:`
# serialization issue on GitHub Actions runners where the args were merged
# into one string and redis-server tried to parse them as a config file.
#
# This file holds NO credentials (audit I4/I6). requirepass is injected at
# container start by deploy/redis-entrypoint.sh from the REDIS_PASSWORD env
# var, which is sourced from .env.Priv in every deployment path (local
# compose, CI preview, prod SSH) — a single source of truth, no placeholders
# to sed-replace and no fail-fast gaps.

appendonly yes
maxmemory 256mb
# #560: 本 conf 被 docker-compose.prod.secure.yml 的 redis 服务挂载，该实例
# 同时承担 celery broker(db0)/result backend(db1) + session 缓存。allkeys-lru
# 会在内存压力下静默驱逐 broker 队列键和结果键 → 任务无声丢失（告警只看得到
# backlog/内存，看不到键消失）。noeviction 让写失败显式报 OOM，与
# docker-compose.prod.yml 的 redis（--maxmemory-policy noeviction）和 k8s
# 可选 redis（05-deps-optional.yaml）保持一致。session 键带 TTL（app 侧），
# 不会因 noeviction 无限增长。
maxmemory-policy noeviction
# #1636：bind 0.0.0.0 令 redis 监听容器网络内的所有接口（compose webgis-net
# 互联）。本 conf 只随 secure 栈分发（该栈 redis 不发布任何端口），安全性
# 依赖两道前提，缺一不可：
# 1) requirepass 强制开启 —— deploy/redis-entrypoint.sh 对 REDIS_PASSWORD
#    fail-fast（无密码拒绝启动），口令来自 .env.Priv；本 conf 自身不存任何
#    凭据（audit I4/I6，见文件头注释）；
# 2) 不得把 6379 发布到宿主/公网 —— 需要宿主侧访问时只绑 127.0.0.1 回环
#    （对齐 docker-compose.prod.yml 标准栈 redis ports 的写法）。
# 放宽任一侧之前先补齐另一侧。
bind 0.0.0.0
