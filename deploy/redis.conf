# Redis configuration for the secure production stack.
# Mounted into the container at /usr/local/etc/redis/redis.conf and loaded
# via `redis-server /usr/local/etc/redis/redis.conf`. Using a config file
# (instead of CLI args) sidesteps a docker-compose list-form `command:`
# serialization issue on GitHub Actions runners where the args were merged
# into one string and redis-server tried to parse them as a config file.
#
# The requirepass directive below is rewritten at container start (see the
# preview step in production.yml) to inject the random preview password.
# In production, .env.Priv's REDIS_PASSWORD is interpolated by compose into
# the command-line override below... no - keep it simple: this file is the
# single source of truth, and the start step sed-replaces the placeholder.

appendonly yes
maxmemory 256mb
maxmemory-policy allkeys-lru
bind 0.0.0.0
# Placeholder; overwritten at startup with the real password.
requirepass __REDIS_PASSWORD_PLACEHOLDER__
