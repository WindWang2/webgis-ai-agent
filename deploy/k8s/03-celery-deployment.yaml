# WebGIS Celery Worker Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webgis-celery
  namespace: webgis-prod
  labels:
    app: webgis-ai-agent
    component: celery
    environment: production
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      app: webgis-ai-agent
      component: celery
  template:
    metadata:
      labels:
        app: webgis-ai-agent
        component: celery
        environment: production
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
      - name: webgis-celery
        image: webgis-prod:v0.1.2
        imagePullPolicy: Always
        # 审计 I25：容器安全上下文 — 禁止权限提升，丢弃所有 capabilities
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        # 审计 P0：exec-form args 不经过 shell，$(VAR) 不会被展开。
        # 改用 sh -c 让 ${CELERY_CONCURRENCY} 正确展开；exec 确保信号直达 celery 进程。
        command: ["/bin/sh", "-c"]
        args: ["exec celery -A app.services.task_queue worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-2}"]
        envFrom:
        - configMapRef:
            name: webgis-config
        - secretRef:
            name: webgis-secret
        livenessProbe:
          exec:
            command:
              - celery
              - -A
              - app.services.task_queue
              - inspect
              - ping
          initialDelaySeconds: 30
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "2Gi"
        volumeMounts:
        # readOnlyRootFilesystem: true 需要显式挂载可写路径为 emptyDir
        - name: tmp
          mountPath: /tmp
        - name: app-data
          mountPath: /app/data
        - name: uploads-volume
          mountPath: /app/uploads
        # #519: worker 的 DATA_DIR=/app/data（见 01-configmap.yaml）。
        # DATA_DIR/uploads 必须与 api 侧一样落到 uploads PVC（而非 emptyDir），
        # 否则 worker 重启后已上传文件消失、任务按本地路径打开即 No such file。
        - name: uploads-volume
          mountPath: /app/data/uploads
        - name: app-pi
          mountPath: /app/.pi
      volumes:
      # 可写路径 emptyDir（rootfs 只读）
      - name: tmp
        emptyDir: {}
      - name: app-data
        emptyDir: {}
      # #394: worker 必须看到 API 写入的上传文件（shapefile/raster 任务）。
      # 与 02-api-deployment.yaml 挂同一个 PVC —— emptyDir 会让每个 worker
      # 只看到自己的空目录，上传文件在 worker 侧"不存在"。
      - name: uploads-volume
        persistentVolumeClaim:
          claimName: webgis-uploads-pvc
      - name: app-pi
        emptyDir: {}
---
# Persistent Volume Claim for Uploads
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webgis-uploads-pvc
  namespace: webgis-prod
spec:
  # #394: api 与 celery 共享上传目录，需要 ReadWriteMany（存储类必须支持
  # RWX，如 NFS / CephFS / 云端共享盘；仅 RWO 时 api+celery 必须同节点调度）。
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard