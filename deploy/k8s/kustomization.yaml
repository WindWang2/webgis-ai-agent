# Kustomization Configuration for WebGIS AI Agent
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: webgis-prod

# 基础资源列表
resources:
- 00-namespace.yaml
- 01-configmap.yaml
- 02-api-deployment.yaml
- 03-celery-deployment.yaml
- 04-ingress.yaml
# 审计 PR H: PDB + API ServiceAccount（无 Role — app 不调 k8s API）
- 06-hpa-pdb-rbac.yaml
# 审计 K8S-06: HPA 从 04-ingress.yaml 拆出，独立成文件便于单独调参。
- 07-hpa.yaml

# 可选依赖（生产环境建议使用外部托管的数据库和Redis，注释掉以下行）
# - 05-deps-optional.yaml

# 配置转换器
configMapGenerator:
- name: webgis-config
  behavior: merge
  literals:
  - ENV=production
  - DEBUG=false

# 替换镜像名称
# #559: images 转换器的 name 必须与 Deployment 镜像的「仓库部分」（不含 tag）
# 精确匹配。之前写成 webgis-prod:latest（name 里带 tag）永远匹配不上
# webgis-prod:v0.1.2（新版本 kustomize 还直接拒绝 name 带 tag），且 newName
# 是占位符 your-registry.com —— 没有任何 pipeline 推送过该坐标。
# 现在 Deployment 直接用 CI 推送的仓库坐标 ghcr.io/windwang2/webgis-ai-agent
# （production.yml build job：env.REGISTRY=ghcr.io + IMAGE_NAME 小写化），
# images 转换器保持匹配（name == 仓库部分）并作为部署时钉 tag 的锚点。
# 部署时把 tag 钉到 CI 实际推送的 sha（与 docker-compose.prod.secure.yml 的
# WEBGIS_IMAGE 契约同理）：
#   kustomize edit set image ghcr.io/windwang2/webgis-ai-agent=ghcr.io/windwang2/webgis-ai-agent:<CI sha>
images:
- name: ghcr.io/windwang2/webgis-ai-agent
  newName: ghcr.io/windwang2/webgis-ai-agent

# 标签生成器
# 注意：不使用 namePrefix/nameSuffix —— Kustomize 不会改写
# envFrom/configMapRef/secretRef/serviceAccountName/volumeClaimTemplates
# 以及 HPA scaleTargetRef 等跨资源引用，加前缀/后缀会导致这些引用失效。
commonLabels:
  app: webgis-ai-agent
  environment: production
  managed-by: kustomize