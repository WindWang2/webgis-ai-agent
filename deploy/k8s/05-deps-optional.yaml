# Optional: Internal PostgreSQL with PostGIS (for demo/test only, production use external DB)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: webgis-prod
  labels:
    app: webgis-ai-agent
    component: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webgis-ai-agent
      component: postgres
  template:
    metadata:
      labels:
        app: webgis-ai-agent
        component: postgres
    spec:
      # #1636：pod 级非 Root 声明（对齐 02-api/03-celery 的 pod 级
      # securityContext）。runAsUser/runAsGroup/fsGroup 取 999 —— postgis
      # 镜像的默认 postgres 用户即 uid/gid 999（与应用镜像的 1001 不同，
      # 强行设 1001 会令数据目录属主与运行用户不符）。容器级
      # allowPrivilegeEscalation / capabilities drop 在各容器 securityContext
      # 保留，此处补 pod 级兜底。
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
      - name: postgres
        image: postgis/postgis:15-3.4@sha256:3f4a5d48e0be9580ed70ed618cd039ce57bbb2dd113053d3836e28513f1f87cd
        ports:
        - containerPort: 5432
        # 审计 I25：容器安全上下文
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false  # Postgres 需写入数据目录（由 PVC 提供）
          capabilities:
            drop:
              - ALL
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: webgis-secret
              key: DB_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: webgis-secret
              key: DB_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: webgis-secret
              key: DB_NAME
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        # 审计 I23：之前 Postgres 无 resources 限制 -> 可 OOM 整节点
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        livenessProbe:
          exec:
            # #1636：不再硬编码 webgis_prod —— POSTGRES_USER 来自 webgis-secret
            # 的 DB_USER（secret.example.yaml 允许任意值），探针与配置脱节。
            # kubelet 不展开 exec 探针 command 里的 $(VAR)（见下方 redis 探针
            # 注释），必须经 sh -c 由容器 shell 展开容器环境变量
            # （POSTGRES_USER 已由上面的 env secretKeyRef 注入）。
            command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\""]
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc
---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: webgis-prod
  labels:
    app: webgis-ai-agent
    component: postgres
spec:
  ports:
  - port: 5432
  selector:
    app: webgis-ai-agent
    component: postgres
---
# PostgreSQL PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: webgis-prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: standard
---
# Optional: Internal Redis (for demo/test only, production use external Redis)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: webgis-prod
  labels:
    app: webgis-ai-agent
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webgis-ai-agent
      component: redis
  template:
    metadata:
      labels:
        app: webgis-ai-agent
        component: redis
    spec:
      # #1636：pod 级非 Root 声明（对齐 02-api/03-celery；redis:7-alpine 的
      # 默认 redis 用户即 uid/gid 999）。fsGroup 999 同时保证 PVC 挂载对
      # 运行用户可写。容器级 allowPrivilegeEscalation / capabilities drop /
      # readOnlyRootFilesystem 在容器 securityContext 保留。
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
      - name: redis
        image: redis:7-alpine@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7
        ports:
        - containerPort: 6379
        # 审计 I25：容器安全上下文 — 禁止权限提升，丢弃所有 capabilities
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        # 审计 I23：Redis 也加 resources（与 maxmemory 1gb 对齐）
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "2Gi"
        # #1676（SEC-04）：`--requirepass $(REDIS_PASSWORD)` 作为独立 argv
        # 元素时，kubelet 在容器启动时把 secret 值展开进进程命令行 ——
        # `kubectl describe`、节点 /proc/<pid>/cmdline 可见明文（该口令同时是
        # celery broker + result backend + session store 的钥匙）。改为
        # sh -c 把完整配置（含 requirepass）写进 /dev/shm tmpfs 的 0400 运行
        # 时 conf 后 exec redis-server；原 command 的配置项原样搬进该 conf
        # （appendonly yes / maxmemory 1gb / maxmemory-policy noeviction）。
        # $$ 不需要：$REDIS_PASSWORD 由容器 shell 从 env（secretKeyRef）展开。
        command: ["/bin/sh", "-c"]
        args:
          - 'umask 077; printf "appendonly yes\nmaxmemory 1gb\nmaxmemory-policy noeviction\nrequirepass %s\n" "$REDIS_PASSWORD" > /dev/shm/redis-runtime.conf; chmod 400 /dev/shm/redis-runtime.conf; exec redis-server /dev/shm/redis-runtime.conf'
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: webgis-secret
              key: REDIS_PASSWORD
        livenessProbe:
          # 审计 P1：kubelet 只在容器的 command/args 里展开 $(VAR_NAME)，
          # exec 探针的 command 不做展开 —— 之前的
          # ["redis-cli","-a","$(REDIS_PASSWORD)","ping"] 把字面量
          # $(REDIS_PASSWORD) 当密码，探针必败 → 容器被反复杀死重启。
          # 改用 sh -c 由容器 shell 展开 REDISCLI_AUTH（同 compose 侧写法，
          # 也避免 -a 把密码暴露在进程列表）。
          exec:
            command: ["sh", "-c", "REDISCLI_AUTH=$REDIS_PASSWORD redis-cli ping"]
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: redis-data
          mountPath: /data
        # #1676：requirepass 运行时 conf 的落点。readOnlyRootFilesystem: true
        # 下必须显式挂可写路径（与 02-api-deployment.yaml 的 /tmp emptyDir
        # 同款做法）；medium: Memory = tmpfs，容器停止即消失，不落节点磁盘。
        - name: redis-runtime
          mountPath: /dev/shm
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-pvc
      # #1676：tmpfs 运行时 conf（口令只在这里与容器 env 出现，不进 argv）。
      - name: redis-runtime
        emptyDir:
          medium: Memory
---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: webgis-prod
  labels:
    app: webgis-ai-agent
    component: redis
spec:
  ports:
  - port: 6379
  selector:
    app: webgis-ai-agent
    component: redis
---
# Redis PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: webgis-prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard