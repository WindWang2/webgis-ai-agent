# WebGIS AI Agent ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: webgis-config
  namespace: webgis-prod
data:
  ENV: "production"
  DEBUG: "false"
  LOG_LEVEL: "INFO"
  PYTHONUNBUFFERED: "1"
  API_PORT: "8000"
  FRONTEND_PORT: "3000"
  # 必须替换为真实的前端域名。设为 "*" 会触发 app/core/config.py 启动校验崩溃
  # （is_production() 且 CORS 含通配符 → 拒绝启动），或一旦校验放宽则变成
  # 配合 allow_credentials=True 的 CSRF 攻击面。
  # PLT-02：Settings.CORS_ORIGINS 是 List[str]，pydantic-settings 从 env 解析
  # 时要求 JSON 数组字符串 —— 裸字符串 "https://..." 会在 api/celery/migration
  # 任一 envFrom 该 ConfigMap 的 Pod 上抛 SettingsError（全栈 CrashLoop）。
  CORS_ORIGINS: '["https://webgis.example.com"]'
  CELERY_CONCURRENCY: "2"
  # #519: DATA_DIR 必须指向可写挂载路径。config.py 默认 "./data"（相对
  # WORKDIR /app/backend），而 k8s rootfs 只读 + 未设此变量 → import 期
  # os.makedirs 抛 Read-only file system → CrashLoopBackOff。两个 Deployment
  # 都把共享 RWX PVC webgis-uploads-pvc 挂在 /app/data（见 02/03 的
  # volumeMounts）—— 整个 DATA_DIR 子树（uploads/analysis_results/
  # monitoring_reports/exports）跨 api/celery pod 共享。
  DATA_DIR: "/app/data"
  # #1688: Ingress 对外域名 —— 04-ingress.yaml 的 host 段（spec.tls[0].hosts[0]
  # 与 spec.rules[0].host）由 kustomization.yaml 的 replacements 在 build 时
  # 从这里注入，部署方只需改这一处（或在外层 overlay 覆盖该 ConfigMap）。
  # 默认值 webgis.internal 是 ICANN 保留的私网 TLD：忘改时公网 DNS 与
  # cert-manager 的 ACME HTTP-01 必然解析失败（响亮失败），不会误指向任何
  # 真实域名。改完这里务必同步上面的 CORS_ORIGINS 为 https://<新域名>，
  # 否则浏览器预检会被拒。
  INGRESS_HOST: "webgis.internal"
---
# ⚠️ 审计 I4：Secret 资源已从此文件移除。
#
# 之前用 stringData 把明文凭证（DATABASE_URL / JWT_SECRET_KEY / Redis URL）
# 提交进 git，且使用弱占位密码（DB / JWT secret 均为默认值）。任何拿到
# repo 访问权的人立即获得 prod 入口；git 历史追溯困难。
#
# 新流程：部署前用 kubectl 创建 Secret（不进 git）：
#
#   kubectl create secret generic webgis-secret --namespace=webgis-prod \
#     --from-literal=DATABASE_URL='postgresql://USER:PWD@postgres:5432/DB' \
#     --from-literal=JWT_SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=REDIS_URL='redis://:PWD@redis:6379/0' \
#     --from-literal=CELERY_BROKER_URL='redis://:PWD@redis:6379/0' \
#     --from-literal=CELERY_RESULT_BACKEND='redis://:PWD@redis:6379/1'
#   # #1689：api /metrics 的 METRICS_TOKEN Bearer 门禁 fail-closed
#   #（app/main.py _require_metrics_token，未配置即 401）。api pod 注解
#   # prometheus.io/scrape（02-api-deployment.yaml）邀请集群内抓取，secret
#   # 缺此键则全部 401 → 监控静默失明（compose 栈以 ${METRICS_TOKEN:?}
#   # 强制提供，k8s 此前无等价来源）：
#     --from-literal=METRICS_TOKEN="$(python3 -c 'import secrets;print(secrets.token_urlsafe(24))')"
#   # #561: 启用 05-deps-optional.yaml（可选内部 postgres/redis）时还需
#   # 组件键（值必须与上面 URL 内嵌的 user/password/db 一致，否则
#   # postgres 初始化的账号与 DATABASE_URL 对不上）：
#   #   --from-literal=DB_USER='USER' \
#   #   --from-literal=DB_PASSWORD='PWD' \
#   #   --from-literal=DB_NAME='DB' \
#   #   --from-literal=REDIS_PASSWORD='PWD'
#
# 或更安全：用 SealedSecrets / External Secrets / Vault 配合 GitOps。
# 详见 docs/DEPLOYMENT.md 的 "Secret Management" 章节。
#
# ── K8S-04：完整字段模板与说明见 deploy/k8s/secret.example.yaml ──
# 该模板列出了全部 stringData 字段（DATABASE_URL / JWT_SECRET_KEY /
# LLM_API_KEY / REDIS_URL / CELERY_BROKER_URL / CELERY_RESULT_BACKEND）
# 及 kubectl apply、SealedSecrets 两种落地方式。**注意**：模板文件
# 本身不要填真实凭证后入库——拷成 secret.yaml 并加入 .gitignore。
