# WebGIS AI Agent API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webgis-api
  namespace: webgis-prod
  labels:
    app: webgis-ai-agent
    component: api
    environment: production
spec:
  # #377: SSE turn-resume buffers are process-local (app/services/chat/
  # event_resume.py — no cross-replica store). A reconnect must land on the
  # SAME pod that served the turn; the Service below pins clients with
  # sessionAffinity: ClientIP and the ingress pins with an nginx cookie, so
  # multi-replica HA does not break resume for existing turns. This is the
  # WEAK fix (probability reduction — new pods / affinity expiry can still
  # strand a resume with error {resumed: false}); the STRONG fix is an
  # externalized resume store (e.g. Redis), tracked separately (not in this
  # PR). Scaling remains safe for NEW turns.
  replicas: 2
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      app: webgis-ai-agent
      component: api
  template:
    metadata:
      labels:
        app: webgis-ai-agent
        component: api
        environment: production
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      # 审计 I24：专用 ServiceAccount，不继承 namespace default SA
      serviceAccountName: webgis-api-sa
      # 审计 I22：topologySpread 防 2 个 api pod 落同一节点 -> 单节点故障全 API 宕
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway  # 不强制（单节点测试集群也能跑）
        labelSelector:
          matchLabels:
            app: webgis-ai-agent
            component: api
      # #476：k8s 的 `command:` 覆盖镜像 ENTRYPOINT —— 镜像的
      # docker-entrypoint.sh（启动前 alembic upgrade head）在 k8s 不生效，
      # 必须显式用 initContainer 执行迁移。Pod Ready 之前 schema 已就绪，
      # 滚动更新期间新副本不会带着旧 schema 接流量。
      initContainers:
      - name: db-migration
        # #559 / #618-37: CI 推送 ghcr.io/windwang2/webgis-ai-agent:<sha>
        # （production.yml build job）。metadata-action 另有 type=ref,event=branch
        # (`master`) 与无 `v` 前缀的 semver。默认 tag 用 `master`，避免 raw
        # apply 去拉从未推送的 `v0.1.2`。生产部署必须钉 CI sha：
        #   kustomize edit set image ghcr.io/windwang2/webgis-ai-agent=ghcr.io/windwang2/webgis-ai-agent:<sha>
        image: ghcr.io/windwang2/webgis-ai-agent:master
        imagePullPolicy: Always
        # #618-33: k8s `command:` 覆盖镜像 ENTRYPOINT，裸 `alembic upgrade
        # head` 不会 stamp 收编 pre-alembic / create_all 库（CrashLoop）。
        # 复用 docker-entrypoint.sh 的 legacy-db 探测 + stamp head + upgrade
        # （幂等）。`true` 是迁移成功后的 CMD，initContainer 以 0 退出。
        command: ["/usr/local/bin/docker-entrypoint.sh"]
        args: ["true"]
        # 与应用容器同一 config/secret 来源（DATABASE_URL 在其中）。
        envFrom:
        - configMapRef:
            name: webgis-config
        - secretRef:
            name: webgis-secret
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
        volumeMounts:
        # readOnlyRootFilesystem 下 psycopg/SQLAlchemy 需要可写 /tmp
        - name: tmp
          mountPath: /tmp
      - name: seed-skills
        # #1729: 镜像 = ghcr.io/windwang2/webgis-ai-agent（与主容器同 tag，
        # 见文件头 #618-37 注释：部署时须钉同一 sha）。把镜像内
        # /app/backend/app/skills（Dockerfile.prod chown 的可写技能目录）
        # 播种进 skills-volume；uploads 的 admin 技能上传（config.py:238）
        # 与 agent 自建技能（skill_creator）此后才不再 EROFS。
        image: ghcr.io/windwang2/webgis-ai-agent:master
        imagePullPolicy: Always
        command: ["sh", "-c", "mkdir -p /seed-skills && cp -a /app/backend/app/skills/. /seed-skills/"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        volumeMounts:
        - name: skills-volume
          mountPath: /seed-skills
      containers:
      - name: webgis-api
        # #618-37: default tag `master` matches CI branch tag. Pin sha at
        # deploy time (kustomize edit set image …:<sha>).
        image: ghcr.io/windwang2/webgis-ai-agent:master
        imagePullPolicy: Always
        # 审计 I25：容器安全上下文 — 禁止权限提升，丢弃所有 capabilities
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        # 与 Dockerfile.prod 的 CMD 保持一致：使用 standalone server 而非 npx serve。
        # 之前的 `cd /app/frontend/out && npx serve` 引用了 Dockerfile.prod 不产出的目录，
        # 导致 k8s 部署下前端永久 502。
        command: ["sh", "-c"]
        # 审计 P0：trap + wait 确保 SIGTERM 正确传播给 uvicorn + node 子进程，
        # 否则滚动更新时 pod 会脏退出（tini 在 k8s 侧不在 pid 1）。
        # #1694 SEC-13：--ws-max-size 与 ws.py:29 / ws_collab.py:51 的
        # _MAX_INBOUND_BYTES=16*1024 对齐（应用层检查在整帧缓冲之后，协议层先限）。
        args: ["trap 'kill 0' TERM INT; uvicorn app.main:app --host 0.0.0.0 --port 8000 --ws-max-size 16384 & node frontend/.next/standalone/server.js -p 3000 & wait"]
        ports:
        - containerPort: 8000
          name: api
        - containerPort: 3000
          name: frontend
        envFrom:
        - configMapRef:
            name: webgis-config
        - secretRef:
            name: webgis-secret
        livenessProbe:
          httpGet:
            path: /api/v1/health/live
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          # #400: 容器同时承载 uvicorn:8000 与 node:3000。只探测 API 会让
          # "node 挂了 + nginx 502 前端" 的 pod 保持 Ready —— exec 探测把
          # /api/v1/ready（依赖不可达返回 503 → 摘出流量）与前端进程
          # 一起纳入就绪判定。
          exec:
            command:
              - python3
              - -c
              - import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/ready', timeout=3); u.urlopen('http://localhost:3000/', timeout=3)
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 2
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        volumeMounts:
        - name: uploads-volume
          mountPath: /app/uploads
        # #519: DATA_DIR（= /app/data，见 01-configmap.yaml）的整个子树落在
        # 共享 RWX PVC webgis-uploads-pvc 上 —— uploads/analysis_results/
        # monitoring_reports/exports 跨 pod 可见（api 有 2 副本 + celery worker）。
        # 修复前 DATA_DIR 挂的是 per-pod emptyDir：celery 写入的结果 api pod
        # 读不到，pod 重建即丢。
        - name: uploads-volume
          mountPath: /app/data
        # readOnlyRootFilesystem: true 需要显式挂载可写路径为 emptyDir
        - name: tmp
          mountPath: /tmp
        - name: app-pi
          mountPath: /app/.pi
        # #1729: 只读根文件系统缺技能目录可写路径 —— 后台技能上传
        # （POST /api/v1/skills/upload，app/api/routes/config.py:238 写相对
        # 路径 "app/skills"）与 agent 自建技能（skill_creator.py 同一目录）
        # 在此前永久 EROFS。WORKDIR 为 /app/backend（Dockerfile.prod），
        # 故相对路径解析为 /app/backend/app/skills。种子由 seed-skills
        # initContainer 播种（否则空挂载会遮掉镜像自带技能）。
        - name: skills-volume
          mountPath: /app/backend/app/skills
        # #1729: HOME=/app（Dockerfile.prod useradd --home /app）→ 运行期
        # 缓存（fontconfig / rasterio GDAL / HF 等写 $HOME/.cache =
        # /app/.cache，镜像内在 Dockerfile.prod:129 预建并 chown）在只读
        # rootfs 下同样 EROFS。
        - name: app-cache
          mountPath: /app/.cache
      volumes:
      - name: uploads-volume
        persistentVolumeClaim:
          claimName: webgis-uploads-pvc
      # 可写路径 emptyDir（rootfs 只读）
      - name: tmp
        emptyDir: {}
      - name: app-pi
        emptyDir: {}
      # #1729: 技能目录（种子来自 seed-skills initContainer）与 HOME 缓存
      - name: skills-volume
        emptyDir: {}
      - name: app-cache
        emptyDir: {}
---
# WebGIS API Service
apiVersion: v1
kind: Service
metadata:
  name: webgis-api-service
  namespace: webgis-prod
  labels:
    app: webgis-ai-agent
    component: api
spec:
  type: ClusterIP
  # #377: SSE turn-resume buffers are process-local (event_resume.py) — a
  # reconnect MUST reach the same pod that ran the turn. ClientIP affinity
  # pins one client to one pod for the session; without it a plain ClusterIP
  # Service round-robins and ~50% of reconnects hit a replica that never saw
  # the turn, failing the resume with error {resumed: false} (the client then
  # stops auto-retrying per contract). WEAK fix: sticky routing only lowers
  # the probability. STRONG fix (not in this PR): externalize the resume
  # store (e.g. Redis) so any replica can serve any resume.
  sessionAffinity: ClientIP
  ports:
  - port: 80
    targetPort: 3000
    name: frontend
  - port: 8000
    targetPort: 8000
    name: api
  selector:
    app: webgis-ai-agent
    component: api