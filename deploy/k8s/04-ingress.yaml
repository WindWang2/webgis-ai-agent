# WebGIS AI Agent Ingress Configuration
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webgis-ingress
  namespace: webgis-prod
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    # #475: SSE 传输契约与 compose nginx 对齐（deploy/nginx/nginx.conf 的两个
    # 流式 location：/api/v1/chat/stream 与 /api/v1/explorer/stream/）。
    # ingress-nginx 默认开启 proxy buffering —— SSE chunk 被攒在缓冲区里批量
    # 下发（用户看到"卡顿 + 一次性涌出"）；nginx.conf 侧对两个流式 location
    # 显式 proxy_buffering off。注解作用于整个 ingress（无法按 path 差异化，
    # 除非拆分多个 Ingress 对象），对非流式路径关闭 buffering 只是轻微的代理
    # 效率损失，可接受。
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # #475: 300s 会把工具链跑数分钟的 chat 轮次硬切断 —— 前端被迫走
    # Last-Event-ID 重连，额外压测 #377 的进程本地 resume 注册表（多副本下
    # 本就是弱依赖）。与 nginx.conf 流式 location 的 proxy_read/send_timeout
    # 3600s 对齐。
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/use-regex: "true"
    # #377: sticky routing for SSE resume — the turn-resume buffers are
    # process-local (event_resume.py), so a reconnect must reach the SAME pod
    # that served the turn. nginx pins each client to one backend with a
    # cookie (paired with the api Service's sessionAffinity: ClientIP). WEAK
    # fix (probability reduction); the STRONG fix is an externalized resume
    # store, tracked separately (not in this PR).
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "webgis_sse_resume"
    # #1688: 签发者清单见 04b-clusterissuer.yaml（ClusterIssuer
    # letsencrypt-prod，HTTP-01）。修复前该注解在仓库内没有任何对应清单 ——
    # cert-manager 发 IssuerNotFound event，webgis-tls 永不创建。
    # 注意该清单是 cluster-scoped，故意不进 kustomization resources
    # （kustomize 的 namespace 转换器会注入 metadata.namespace 并被 apiserver
    # 拒绝），需 `kubectl apply -f deploy/k8s/04b-clusterissuer.yaml` 单独应用。
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    # #1688: host 不再是写死的占位符 —— 单一事实来源是 01-configmap.yaml 的
    # INGRESS_HOST，kustomization.yaml 的 replacements 在 build 时覆盖这里的
    # 字面值（spec.tls[0].hosts[0] 与 spec.rules[0].host 两处）。此处的
    # webgis.internal 只是让 raw-apply 也能通过 schema 校验的默认值：.internal
    # 是 ICANN 保留的私网 TLD，忘改时公网 DNS 与 ACME HTTP-01 必然解析失败
    # （响亮失败），不会误指向任何真实域名。改域名只需改 INGRESS_HOST 一处，
    # 并同步 01-configmap.yaml 的 CORS_ORIGINS。
    - webgis.internal
    secretName: webgis-tls
  rules:
  - host: webgis.internal
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: webgis-api-service
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: webgis-api-service
            port:
              number: 80