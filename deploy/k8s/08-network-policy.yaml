# Ingress isolation for application and optional datastore pods. Egress stays
# configurable because deployments can use private geodata endpoints.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: webgis-ingress
  namespace: webgis-prod
spec:
  podSelector:
    matchLabels:
      app: webgis-ai-agent
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: webgis-ai-agent
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - {protocol: TCP, port: 8000}
        - {protocol: TCP, port: 3000}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - {protocol: TCP, port: 8000}
