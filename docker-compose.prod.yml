# ============================================================
# WebGIS AI Agent 生产环境 Docker Compose
# 使用: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# 凭证放 .env.prod（gitignored，从入库模板 .env.prod.example 复制后填写，
# 真实密码严禁写进 .env.prod.example 等可提交文件）。
# --env-file .env.prod 同时供 ${VAR} 插值（env_file 只传容器，不参与插值）。
# ============================================================
services:
  # PostgreSQL 数据库（含 PostGIS）
  db:
    image: postgis/postgis:15-3.4
    container_name: webgis-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-webgis_prod}
      POSTGRES_PASSWORD: ${DB_PWD:?Set DB_PWD in .env.prod}
      POSTGRES_DB: ${DB_NAME:-webgis_prod}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:5432"
    volumes:
      - pg_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-webgis_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - webgis-net
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2.0"
        reservations:
          memory: 2g
          cpus: "1.0"

  # Redis 缓存/消息队列
  redis:
    image: redis:7-alpine
    container_name: webgis-prod-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    command: >
      redis-server
      --appendonly
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.prod}
    volumes:
      - redis_prod_data:/data
    healthcheck:
      # 用 REDISCLI_AUTH 传密码，避免 -a 把密码暴露在进程列表 / shell history。
      # $$ 转义让 compose 不展开，运行时由容器 shell 解析 $REDIS_PASSWORD。
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - webgis-net
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
        reservations:
          memory: 512m
          cpus: "0.25"

  # 后端 API 服务
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: runner
    container_name: webgis-prod-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-18000}:8000"
      - "127.0.0.1:${FRONTEND_PORT:-13000}:3000"
    environment:
      - ENV=production
      - RAG_EMBEDDING_OFFLINE=true  # #662: 离线加载 embedding 模型（缓存预置见 docs/DEPLOYMENT.md）
      - DEBUG=false
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/1
      - CORS_ORIGINS=${CORS_ORIGINS}
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      # #519: DATA_DIR=/app/data —— 整个数据目录（uploads/analysis_results/
      # monitoring_reports/exports/.pi_bridge_secret）落在共享命名卷 webgis_data
      # （api 与 celery-worker 挂同一卷）。之前 api 用 DATA_DIR=/app 但 celery
      # worker 写到 /app/backend/data/...（默认相对 WORKDIR），产物跨容器 404。
      - DATA_DIR=/app/data
    env_file:
      # .env.prod 不入库（.gitignore 已忽略）；入库的只有 .env.prod.example 模板。
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # #519: 共享命名卷覆盖整个 DATA_DIR（/app/data）。uploads 由应用解析到
      # DATA_DIR/uploads（get_upload_dir → Path(DATA_DIR)/"uploads"/<id>），
      # 与分析结果/报告/导出同卷 —— api 与 worker 各自容器层的路径差异消失。
      - webgis_data:/app/data
    # #474：compose 的 service healthcheck 会完全覆盖镜像 HEALTHCHECK —— 之前
    # 这里只探 uvicorn:8000，与 #400 的双进程镜像 HEALTHCHECK（Dockerfile.prod，
    # 同时探测 :8000 与 node :3000）相比是退化：node 前端进程挂掉时容器仍
    # "healthy"，nginx 对 / 502 而编排层毫无感知。与镜像保持一致的双探测。
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/health/live', timeout=5); u.urlopen('http://localhost:3000/', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - webgis-net
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 1g
          cpus: "0.5"

  # Celery Worker（异步任务处理）
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: runner
    container_name: webgis-prod-celery
    restart: unless-stopped
    environment:
      - ENV=production
      - RAG_EMBEDDING_OFFLINE=true  # #662: 离线加载 embedding 模型（缓存预置见 docs/DEPLOYMENT.md）
      - DEBUG=false
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/1
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      # #519: worker 与 api 使用同一 DATA_DIR（/app/data），且挂同一个共享卷
      # webgis_data —— worker 写 analysis_results/monitoring_reports 落共享卷，
      # api 的静态/下载路由按 DATA_DIR 解析同卷路径，产物跨容器可见。
      # 默认 "./data" 在 WORKDIR /app/backend 下展开 → worker 把
      # /app/backend/data/... 写进 DB，api 从 /app/... 下发，记录路径 404。
      - DATA_DIR=/app/data
      # #476：镜像 entrypoint 现在会先跑 alembic upgrade head —— api 与
      # celery-worker 同时 up 会并发 upgrade 竞争 alembic_version 表。
      # 迁移的唯一所有者是 api 容器；worker 跳过。
      - SKIP_DB_MIGRATIONS=true
    env_file:
      # .env.prod 不入库（.gitignore 已忽略）；入库的只有 .env.prod.example 模板。
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.services.task_queue worker --loglevel=info --concurrency=2
    volumes:
      # #471+#519：worker 必须与 api 看到同一批文件（celery 任务按本地路径打开
      # raster/shapefile 与写产物）。挂同一个 webgis_data 卷到同一 DATA_DIR 路径
      # —— 上传、分析结果、报告全部共享；否则上传成功/产物登记的分析任务在
      # worker 侧"No such file"，api 侧 404。
      - webgis_data:/app/data
    networks:
      - webgis-net
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 1g
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.services.task_queue inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Nginx 反向代理（可选，用于生产环境）
  nginx:
    image: nginx:alpine
    container_name: webgis-prod-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # 审计 P2：与 secure 版和 nginx.conf 期望一致 —— nginx.conf 引用
      # /etc/nginx/ssl/server.crt|server.key。请把 server.crt / server.key
      # 放到 ./deploy/nginx/ssl/（.gitignore 已忽略 *.crt/*.key），否则
      # nginx 启动即 crash（找不到证书）。之前误挂 ./deploy/ssl。
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_log:/var/log/nginx
    depends_on:
      - api
    networks:
      - webgis-net
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
        reservations:
          memory: 128m
          cpus: "0.1"

  # Prometheus 指标收集（可选）
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: webgis-prod-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # #473：此前 prod（非 secure）栈没挂载告警规则文件，而 prometheus.yml
      # 的 rule_files 引用它 —— 规则从未加载，任何告警都不可能触发。
      - ./deploy/alerts-rules.json:/etc/prometheus/alerts-rules.json:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - webgis-net
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
        reservations:
          memory: 512m
          cpus: "0.25"

  # PostgreSQL exporter（#473：pg_up 的数据源 —— Database_Connection_Failure
  # 告警之前引用 pg_up 但没有任何 exporter 被抓取，是永不触发的装饰性监控）
  postgres-exporter:
    image: docker.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: webgis-prod-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER:-webgis_prod}:${DB_PWD:?Set DB_PWD in .env.prod.example}@db:5432/${DB_NAME:-webgis_prod}?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - webgis-net
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
        reservations:
          memory: 128m
          cpus: "0.1"

  # Redis exporter（#473：redis_memory_* / redis_key_size 的数据源 ——
  # Redis_Memory_High 与 Celery_Task_Backlog 告警）。check-keys=celery 导出
  # celery 默认队列（Redis list key "celery"）长度为 redis_key_size。
  redis-exporter:
    image: docker.io/oliver006/redis_exporter:v1.58.0
    container_name: webgis-prod-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.prod.example}
      REDIS_EXPORTER_CHECK_KEYS: celery
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - webgis-net
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
        reservations:
          memory: 128m
          cpus: "0.1"

  # Node exporter（#473：node_filesystem_* 的数据源 —— Disk_Space_Low 告警）。
  # 只读挂载宿主 /proc /sys /，监控容器所在宿主机（Linux）的根文件系统。
  node-exporter:
    image: docker.io/prom/node-exporter:v1.7.0
    container_name: webgis-prod-node-exporter
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    networks:
      - webgis-net
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
        reservations:
          memory: 128m
          cpus: "0.1"


  # Grafana 可视化面板（可选）
  grafana:
    image: grafana/grafana:10.3.3
    container_name: webgis-prod-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:13001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PWD:?Set GRAFANA_PWD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - webgis-net
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
        reservations:
          memory: 128m
          cpus: "0.1"

volumes:
  pg_prod_data:
  redis_prod_data:
  # #519: 共享数据卷 —— 覆盖 api + celery-worker 的 DATA_DIR（/app/data）。
  # 迁移注意：旧栈的 uploads 卷（原挂 /app/uploads）数据不会自动搬过来，
  # 如需保留历史上传，把旧卷内容拷入本卷的 uploads/ 子目录。
  webgis_data:
  nginx_log:
  prometheus_data:
  grafana_data:

networks:
  webgis-net:
    driver: bridge