# One-shot: restore app/api/routes/layer.py from master and set Cache-Control max-age=30 (#1112).
# Self-deletes after success to avoid lingering automation.
name: fix-1112-restore-layer
on:
  push:
    branches: [fix/1112-tile-cache-control]
    paths:
      - ".github/workflows/fix-1112-restore-layer.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fix-1112-restore-layer
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1112-tile-cache-control
          fetch-depth: 0
      - name: Restore layer.py from master and shorten Cache-Control TTL
        run: |
          set -euo pipefail
          git fetch origin master
          git show origin/master:app/api/routes/layer.py > app/api/routes/layer.py
          python3 <<'PY'
          from pathlib import Path
          p = Path("app/api/routes/layer.py")
          text = p.read_text(encoding="utf-8")
          old_mvt = '"Cache-Control": "private, max-age=300",  # ref 数据会话内不可变'
          new_mvt = '"Cache-Control": "private, max-age=30",  # short TTL: overwrite/rollback mutates same ref_id (#1112)'
          old_png = '"Cache-Control": "private, max-age=300",'
          new_png = '"Cache-Control": "private, max-age=30",  # short TTL: overwrite/rollback mutates same ref_id (#1112)'
          if old_mvt not in text:
              raise SystemExit("MVT Cache-Control line not found as expected")
          text = text.replace(old_mvt, new_mvt, 1)
          if text.count(old_png) != 1:
              raise SystemExit(f"expected exactly one remaining max-age=300 Cache-Control, got {text.count(old_png)}")
          text = text.replace(old_png, new_png, 1)
          if "max-age=300" in text:
              raise SystemExit("max-age=300 still present after patch")
          if text.count("max-age=30") < 2:
              raise SystemExit("expected at least two max-age=30 occurrences")
          p.write_text(text, encoding="utf-8")
          print("patched ok", p.stat().st_size)
          PY
          rm -f .github/workflows/fix-1112-restore-layer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/routes/layer.py
          git add -u .github/workflows/fix-1112-restore-layer.yml
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "$(cat <<'MSG'
          fix(cache): restore layer.py with Cache-Control max-age=30 (#1112)

          Overwrite/rollback mutates the same ref_id, so max-age=300 could serve
          stale tiles for up to 5 minutes. Keep ETag conditional 304 path.
          MSG
          )"
          git push origin HEAD:fix/1112-tile-cache-control
