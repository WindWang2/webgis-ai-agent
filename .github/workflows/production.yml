# ============================================================
# WebGIS AI Agent CI/CD Pipeline
# 自动构建、测试、部署到生产环境
# ============================================================

name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - 'release/**'
  pull_request:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# 同一分支/PR 的过时 run 直接取消，避免重复流水线；master push（含部署）
# 与 nightly 调度不取消 —— 在途 deploy 绝不能被并发组杀掉。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  # github.repository 含大写字母（如 WindWang2/webgis-ai-agent），
  # docker tag 要求全小写 -> 转换。
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: '3.12'

jobs:
  # ============ Stage 1: 代码质量检查 ============
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        # pnpm 是唯一包管理器（audit5 #1083：npm lockfile 已删除，仓库只
        # 维护 frontend/pnpm-lock.yaml）。action-setup 必须先于 setup-node，
        # 否则 setup-node 的 pnpm 缓存找不到可执行文件。
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        # 与 test-frontend job 保持一致：固定 Node 22（ESLint 9 要求
        # node ^18.18 || ^20.9 || >=21.1），并启用 pnpm 缓存。
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Ruff Linter
        run: pip install ruff

      - name: Run Ruff Check
        # Blocking gate on production code, tests, and root entrypoints. The
        # app/ backlog was cleared in the lint-cleanup PRs and tests/ + root
        # entrypoints were cleared to 0 in #303, so this actually blocks and
        # keeps the test suite lint-clean. Config lives in pyproject.toml
        # [tool.ruff.lint] (E402 ignored globally by policy).
        run: ruff check --output-format=github app/ tests/ main.py manage.py

      - name: Install Frontend Deps
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: ESLint Check
        # ESLint 9 + flat config（eslint.config.mjs）已上线：eslint 升级到 9.x 并
        # 把全量 lint 清零（--max-warnings 0）。此步骤是阻塞 gate —— 任何 error /
        # warning 都让 lint job 失败，与上面的 ruff gate 对齐，不再 || true 兜底。
        # next build 已设 eslint.ignoreDuringBuilds（next 14 内置 lint 在
        # ESLint 9 下不兼容），构建期 lint 统一由这里把关。
        working-directory: ./frontend
        run: pnpm exec eslint . --max-warnings 0

  # ============ Stage 2: 单元测试 ============
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        # requirements-dev.txt includes requirements.txt + test deps (pytest,
        # pytest-cov, fakeredis). psycopg2-binary for CI's Postgres service.
        run: pip install -r requirements-dev.txt httpx psycopg2-binary

      - name: Install pnpm
        # test_mapspec_store 编译走 frontend/lib/mapspec-compiler（jiti 运行时）。
        # 不装 frontend 依赖时 npx 每次现拉 npm 包，冷缓存下直接撞 45s 超时。
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Frontend Dependencies (MapSpec CLI runtime)
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Set Environment Variables
        run: |
          # CI 已配 Postgres + Redis service container。这里指向它们。
          echo "DATABASE_URL=postgresql://test_user:test_pass@localhost:5432/test_db" >> $GITHUB_ENV
          echo "REDIS_URL=redis://localhost:6379/0" >> $GITHUB_ENV
          echo "JWT_SECRET_KEY=ci-test-secret-key-32-chars-ok" >> $GITHUB_ENV
          echo "ENV=development" >> $GITHUB_ENV
          echo "LLM_API_KEY=test-key-not-real" >> $GITHUB_ENV

      - name: Run Tests with Coverage
        # #564：旧注释宣称"现实基线 ~10%"是失真的 —— 本地全量实测
        # （master bb09e8c + 本批修复后）TOTAL 82.16%（37299 stmts）。闸值
        # 10 因此是装饰性的（任何覆盖率都能绿）。按 ratchet 模式设为 75：
        # 真实可执行（覆盖大幅回退即红），但留出 CI 环境（Py3.12 vs 本地
        # 3.13 / 依赖版本）的抖动余量；每次提升后同步调高此闸值。
        #
        # #612：.coveragerc 的 exclude_lines 裸 `pass` 正则（未锚定）会把含
        # "pass" 子串的行（password/overpass 等）整块排除出分母——已改为锚定
        # `^\s*pass\s*$`。诚实分母下本地全量实测（master 4902905 + 本批修复）
        # TOTAL 82%（38749 stmts vs 旧配置 38344 stmts，+405 条语句如实计入），
        # 75 门禁不受影响；今后新增未覆盖的敏感词行代码不再能借排除规则隐身。
        #
        # 不加 -x：保留所有失败用例的输出，便于一次看到全部问题。
        # 不加 || true：测试失败应阻断 CI，这才是 gate 的意义。
        #
        # 注意：session_data_manager 的 asyncio event loop 隔离问题已通过懒加载
        # Redis 连接修复（见 app/services/session_data_redis.py），不再在 import 时
        # 绑定 event loop。
        #
        # 性能回归 harness（tests/benchmarks/*，@pytest.mark.perf）从覆盖率运行中
        # 排除：coverage 追踪会把纯 Python 热路径拖慢 2-4 倍，使基线判定失真
        # （PR #319 首次 CI 暴露：h3_binning_10k 在 --cov 下 173.9ms vs 无 cov
        # 40ms，被误判为 HARD REGRESSION）。perf 门控由独立 test-perf job 在无
        # coverage 环境下执行（见下）。
        #
        # 审计 REL-01：cartography marker（@pytest.mark.cartography）同样排除 ——
        # 该集合由独立 cartography-smoke job（确定性 release-blocking gate）拥有，
        # 避免双重执行 + 让 gate scope 显式。
        #
        # #477：real_services marker 同理排除 —— 由独立 real-services-smoke
        # job（postgis + redis service containers + 真实 celery worker）拥有。
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=75 --timeout=60 --timeout-method=thread -m "not perf and not cartography and not real_services" -v

      - name: Upload Coverage Report
        uses: codecov/codecov-action@v7.0.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload Coverage XML
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ============ Stage 2a: 迁移链对真实 PostGIS 的执行门 (#476) ============
  # 之前所有测试从全新 create_all 起步 —— 迁移链从未在真实 Postgres 上执行过
  # （含 PostGIS 专属的 0011），模型↔迁移漂移完全不可见（如 0016 修复的
  # knowledge_documents.org_id/creator_id）。deploy 路径（entrypoint /
  # k8s initContainer）现在会真正执行 alembic upgrade head，此 lane 在 PR
  # 阶段验证同一件事：链能在 PostGIS 上跑通，且产出与 Base.metadata 一致。
  db-migrations:
    name: DB Migration Gate (PostGIS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        # requirements.txt 自带 alembic + sqlalchemy + psycopg2-binary；
        # dev 依赖只需要 pytest（drift check 用）。
        run: pip install -r requirements.txt pytest pytest-cov

      - name: Run Alembic Upgrade Head against PostGIS
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
        run: alembic upgrade head

      - name: Model vs Migration Drift Check
        # 迁移建出的 schema 必须覆盖模型声明的表/列/索引 —— 漂移即失败
        # （这正是 #476 的根因：模型加列而迁移链不跟，生产库静默缺列）。
        env:
          MIGRATION_DRIFT_DB_URL: postgresql://test_user:test_pass@localhost:5432/test_db
          JWT_SECRET_KEY: ci-test-secret-key-32-chars-ok
        run: pytest tests/test_deploy_migration_wiring.py::test_migrated_schema_matches_models --no-cov -q

  # ============ Stage 2a-2: 真实服务 smoke lane (#477, #531) ============
  # test-backend 配了 postgis + redis service container，但套件实际跑
  # SQLite / fakeredis / eager-celery（conftest 强制 USE_REDIS=false +
  # CELERY_BROKER_URL=memory://）—— asyncpg 驱动行为、PostGIS 类型、真实
  # Redis 线协议、真实 broker 投递/撤销从未被验证。此 lane 用同一批
  # provisioned 容器跑定向 smoke 子集（-m real_services；服务不可达时
  # self-skip，本地无容器不红）。不把整套测试搬到真实后端 —— 目标是
  # prod-backend 回归在 CI 有真实覆盖。
  #
  # #531：lane 显式导出 USE_REDIS=true + CELERY_BROKER_URL/RESULT_BACKEND，
  # 使 production celery app（app.services.task_queue）脱离 conftest 的
  # eager/memory 钉扎 —— 真实 worker（-A app.services.task_queue）投递生产
  # 任务并取回结果，不再只验证 toy app。
  real-services-smoke:
    name: Real Services Smoke (PostGIS + Redis + Celery)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements-dev.txt

      - name: Set Environment Variables
        run: |
          echo "DATABASE_URL=postgresql://test_user:test_pass@localhost:5432/test_db" >> $GITHUB_ENV
          echo "REDIS_URL=redis://localhost:6379/0" >> $GITHUB_ENV
          echo "JWT_SECRET_KEY=ci-test-secret-key-32-chars-ok" >> $GITHUB_ENV
          echo "ENV=development" >> $GITHUB_ENV
          echo "LLM_API_KEY=test-key-not-real" >> $GITHUB_ENV
          # #531：conftest.py 用 setdefault 强制 USE_REDIS=false +
          # CELERY_BROKER_URL=memory://（测试进程离线）—— 已设置的变量不会被
          # setdefault 覆盖。这里显式打开真实 Redis 线协议：production celery app
          # （app.services.task_queue）在 broker db 6 / result backend db 7 上走
          # 真实投递，worker 由 fixture 以 -A app.services.task_queue 启动。
          echo "USE_REDIS=true" >> $GITHUB_ENV
          echo "CELERY_BROKER_URL=redis://localhost:6379/6" >> $GITHUB_ENV
          echo "CELERY_RESULT_BACKEND=redis://localhost:6379/7" >> $GITHUB_ENV
          # #661：smoke 的 self-skip 只认显式 REAL_SERVICES=1。全量套件里
          # import app.main 会 load_dotenv() 把本地 .env 的 REDIS_URL 泄进
          # os.environ —— 有可达 Redis 的开发机上 ambient 环境会打穿守卫，
          # production worker 在本地挂死。真 lane 必须显式亮明身份。
          echo "REAL_SERVICES=1" >> $GITHUB_ENV

      - name: Run Real-Services Smoke
        # 与 test-backend 同批 service container：asyncpg 真实往返、PostGIS
        # geometry 类型、真实 Redis SET/GET/EXPIRE/TTL/pipeline、真实 celery
        # worker（broker 投递 + chain + result backend + revoke 丢弃）。
        run: pytest -m real_services --no-cov --timeout=180 --timeout-method=thread -q

  test-perf:
    name: Performance Regression Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        # 只装 harness 需要的依赖（无需 Postgres/Redis service containers）。
        # pytest-cov 必须安装：pytest.ini 的 addopts 声明了 --cov=app，缺它则
        # 整个 pytest 启动直接报 "unrecognized arguments: --cov"。--no-cov 在
        # 命令行覆盖 addopts，确保 harness 在无覆盖率下运行。
        # pytest-asyncio 必须安装：test_job_runtime_perf.py 在模块层
        # `import pytest_asyncio`（pytest.ini 的 asyncio_mode=auto 依赖它），
        # 缺了收集期直接 ImportError → lane 红。pin 与 requirements-dev.txt
        # 保持一致（>=1.4.0），改动时两处同步。
        run: pip install -r requirements.txt pytest pytest-asyncio>=1.4.0 pytest-timeout pytest-cov

      - name: Run Performance Harness (no coverage)
        # 性能门控：在无 coverage 干扰的环境下跑确定性 harness（compute 11 个
        # workload + transport 4 个 streaming workload，全部 -m perf）。warn 区间
        # （1.75x-4x）即失败，让真实回归在 CI 可见；基线刷新需显式
        # PERF_UPDATE_BASELINES=1。与主测试 job 的 `-m "not perf"` 互斥，避免双重
        # 执行 + 覆盖率失真。
        #
        # #564：把三个 perf-marked 的"行为量"基准（durable job runtime 语义、
        # provenance 指纹复杂度、bench_runner 可复现 smoke）纳入 PR 门 —— 它们
        # 是确定性/快子集（无墙钟紧断言），补上此前"perf 文件在 PR 零执行"的
        # 缺口。
        # #618-29：test_llm_http_pooling_perf.py 同样是 work-count / 无墙钟，
        # 进 PR。test_perf_harness_v2.py（event-loop lag）与
        # test_perf_mapspec_e2e.py（1k/10k/50k + lag monitor）保持 nightly
        # 专属，避免打满本 job 的 180s thread timeout。
        run: pytest tests/benchmarks/test_perf_harness.py tests/benchmarks/test_transport_perf.py tests/benchmarks/test_job_runtime_perf.py tests/benchmarks/test_provenance_perf.py tests/benchmarks/test_llm_http_pooling_perf.py tests/benchmarks/test_perf_mapspec_mutation_cost.py tests/benchmarks/test_dispatch_stall_perf.py tests/benchmarks/test_perf_large_workspace.py tests/perf/test_runtime_v2_perf_contracts.py -m perf --no-cov --timeout=180 --timeout-method=thread -q

  # ============ Stage 2c: 制图 / Harness 闭环 smoke（确定性，release-blocking）============
  cartography-smoke:
    name: Cartography & Harness Closed-Loop Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        # 仅装核心依赖 + 测试工具（无需 Postgres service）。cartography smoke
        # 走纯 Python 语义校验 + Harness V2 evidence model + ref 真实解析，
        # 不依赖 Node / Chromium（浏览器 runtime 门在独立 runtime-validator
        # lane，#532）。
        run: pip install -r requirements-dev.txt

      - name: Set Environment Variables
        run: |
          echo "REDIS_URL=redis://localhost:6379/0" >> $GITHUB_ENV
          echo "JWT_SECRET_KEY=ci-test-secret-key-32-chars-ok" >> $GITHUB_ENV
          echo "ENV=development" >> $GITHUB_ENV
          echo "LLM_API_KEY=test-key-not-real" >> $GITHUB_ENV

      - name: Run Cartography & Harness Closed-Loop Smoke
        # 确定性 release-blocking gate（无 Node / 无 Chromium / 无 LLM / 无外网）：
        #   - MapSpec transaction 语义（invalid mutation 不污染 last-known-good）
        #   - ref cursor 真实解析（跨 session / 不存在 → fail，而非 100%）
        #   - MapSpecValidity evidence ladder（no evidence ≠ success）
        #   - 制图语义 deterministic checks（bbox overlap / geom-type / field-stops / legend）
        #   - 故障注入子集（Redis/compiler/checkpoint failure 不产生 false-success）
        # Playwright runtime（真实 MapLibre 渲染门）在独立的 runtime-validator
        # lane（nightly + 手动，#532）；5~6 类 E2E 场景仍待建。
        run: pytest -m cartography --no-cov --timeout=120 --timeout-method=thread -q

  # ============ Stage 2c-2: Playwright runtime validator（#532；nightly + 手动）============
  # test_runtime_validator_full_flow 之前在**所有** lane 都 self-skip：没有任何 lane
  # 安装 frontend/node_modules（playwright）+ chromium，真实 MapLibre 渲染门从未
  # 执行（#404 那类 mock-vs-real 语义漂移零 CI 覆盖）。此 lane 安装两者并以
  # REQUIRE_BROWSER=1 硬失败模式运行 —— 缺浏览器 = 失败，不再是绿色 SKIPPED。
  # Chromium 下载 + MapLibre CDN (unpkg) 依赖外网，放 nightly / 手动触发，不进
  # PR 阻塞路径（PR 各 lane 里该测试仍按文档 self-skip）。
  runtime-validator:
    name: Playwright Runtime Validator (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        # pnpm 是唯一包管理器（audit5 #1083）；action-setup 先于 setup-node。
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Frontend Deps
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        # playwright 包来自 pnpm install；chromium 二进制需显式安装
        # （--with-deps 拉系统库，ubuntu-latest runner 有 sudo）。
        working-directory: ./frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Provision Compiler Runtime (tsx)
        # 编译器/验证器子进程以 `pnpm exec tsx cli.ts` / `pnpm exec tsx
        # runtime-validate.ts` 运行；tsx 只是前端工具链的 optional peer dep，
        # pnpm install 不装它 —— 显式装上（--no-save 不碰 package.json /
        # lockfile），否则子进程 CLI_UNAVAILABLE。
        working-directory: ./frontend
        run: pnpm add --no-save tsx@^4.8.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python Deps
        run: pip install -r requirements-dev.txt

      - name: Run Runtime Validator (hard-fail on missing browser)
        env:
          REQUIRE_BROWSER: '1'
        run: pytest tests/unit/test_runtime_validator.py -m heavy --no-cov --timeout=180 --timeout-method=thread -q

  # ============ Nightly 重矩阵（schedule / 手动；非 PR-blocking）============
  # 审计 REL-01：PR 路径只跑确定性 fast gate（cartography-smoke）。更重的矩阵
  # （全量 cartography + perf + event-loop lag + 并发负载 + Playwright runtime ——
  # 后者在独立 runtime-validator lane，#532）放到 nightly，不阻塞 PR，但能在
  # schedule 暴露慢漂移 / 间歇性故障。
  nightly-matrix:
    name: Nightly Heavy Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - run: pip install -r requirements-dev.txt
      - name: Set Environment Variables
        run: |
          echo "REDIS_URL=redis://localhost:6379/0" >> $GITHUB_ENV
          echo "JWT_SECRET_KEY=ci-test-secret-key-32-chars-ok" >> $GITHUB_ENV
          echo "ENV=development" >> $GITHUB_ENV
          echo "LLM_API_KEY=test-key-not-real" >> $GITHUB_ENV
      - name: Full cartography + perf + event-loop matrix
        # Nightly 跑完整确定性矩阵：cartography（含并发 + 故障注入）+ perf
        # （11 microbenchmarks + 3 e2e + job_runtime/provenance/bench_runner/
        # perf_harness_v2 —— #564 给 v2 补上 perf marker 后由 -m perf 统一收集）。
        # 无 Node 依赖部分全跑；需要 Node/Playwright 的 runtime 验证在独立
        # runtime-validator lane（REQUIRE_BROWSER=1 硬失败，#532）。
        run: pytest -m "cartography or perf" --no-cov --timeout=180 --timeout-method=thread -q

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        # pnpm 是唯一包管理器（audit5 #1083）；action-setup 先于 setup-node。
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        # Node 20 已被 GitHub Actions 弃用（runner 强制升到 Node 24 运行 action）。
        # 用当前 LTS (22) 保持与本地开发环境兼容。
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Run Vitest
        working-directory: ./frontend
        run: pnpm run test:ci

      - name: TypeScript Check
        # tsc --noEmit 抓类型错误（比 next build 快，单独跑让类型错误优先暴露）。
        working-directory: ./frontend
        run: pnpm run typecheck

      - name: Production Build
        # 审计 CI-GAP（PR #151 暴露）：之前 test-frontend 只跑 vitest，不跑 next build。
        # use-client 指令顺序错误（webpack-only 检查）直到 Docker prod build 才被发现，
        # 已合入 master。在此 PR 阶段跑 next build，把生产构建错误前移到快速反馈环。
        # next build 同时校验：指令顺序、SSR 兼容性、静态导出、webpack 配置。
        working-directory: ./frontend
        run: pnpm run build

      - name: Upload Coverage
        uses: codecov/codecov-action@v7.0.0
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend
          fail_ci_if_error: false

  # ============ Stage 2b: 部署传输配置门控 ============
  # transport goal E-F-9：之前 CI 没有校验 nginx 配置语法。一个坏掉的 SSE
  # location 正则、keepalive map 或超时指令可以 invisibly 合入 master。这个
  # job 在 PR 阶段把 nginx 语法回归前移到快速反馈环。（API base 的 ?? 语义由
  # frontend/lib/api/config.test.ts 在 test-frontend job 覆盖。）
  deploy-config:
    name: Deploy Transport Config Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Validate nginx config syntax (nginx -t)
        # E-F-1/E-F-7：SSE location 正则、keepalive map、超时配置都必须语法合法。
        # nginx -t 在加载配置时会校验被引用的文件存在（ssl 证书/key）并解析 upstream
        # 主机名，所以：挂一次性自签证书到 /etc/nginx/ssl；用 --add-host 让 compose
        # service 名 `api` 可解析（nginx -t 只解析不连接，指向 127.0.0.1 即可）。
        run: |
          mkdir -p .nginx-ssl
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout .nginx-ssl/server.key -out .nginx-ssl/server.crt \
            -subj "/CN=localhost" 2>/dev/null
          docker run --rm \
            --add-host api:127.0.0.1 \
            -v "$PWD/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/.nginx-ssl:/etc/nginx/ssl:ro" \
            nginx:alpine nginx -t

  # ============ Stage 3: 安全扫描 ============
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Bandit Security Scan
        # 之前用 axel-op/github-action-bandit@v1，但该 action 仓库已被删除/重命名
        # (Unable to resolve action ... repository not found)。直接 pip install
        # bandit 跑，等效。
        # -ll = MEDIUM severity 及以上；-ii = MEDIUM confidence 及以上。
        # exit code 0 = 无 MEDIUM+ 告警；CI 不被 LOW 噪声阻断。
        #
        # 审计 REL-02：bandit 是 release-blocking security gate，必须真正阻断 ——
        # 此 job 处于 build→deploy 依赖链上，不能 || true。依赖 CVE 扫描
        # (pip-audit / npm audit) 现已拆到独立 dependency-audit job（见下），
        # 该 job 诚实标注为 informational / 非 release-blocking，而不是在
        # blocking 的 security job 内用 || true 把失败伪装成成功。
        run: |
          pip install bandit
          bandit -r app/ -ll -ii

  # ============ Stage 3b: 依赖 CVE 扫描（informational，非 release-blocking）============
  # 审计 REL-02：此前 pip-audit / npm audit 用 `|| true` 兜底在 blocking 的
  # security job 内，使"required job 失败被伪装成成功"。已知 starlette / ecdsa
  # 等传递依赖 CVE 需 FastAPI / PyJWT 上游升级，无法在任意 PR 内即时修复，
  # 故无法作为 blocking gate。将其拆为独立 job 并明确标注非阻塞：信号可见、
  # 诚实，且不再污染 blocking 的 security gate。major-version 依赖升级 PR
  # 仍需通过下方完整的 blocking 链（backend/frontend/perf/cartography/build）。
  dependency-audit:
    name: Dependency CVE Audit (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Dependency Audit (Backend)
        # pip-audit 抓到多个传递依赖 CVE（starlette 0.38.6 的 PYSEC-2026-161/1941/
        # 1943/2280/2281/248/249 + ecdsa 0.19.2 的 PYSEC-2026-1325）。这些需要升级
        # FastAPI / PyJWT 上游依赖，是独立工作。本 job 非 release-blocking，
        # 仅输出告警；无需 || true —— 它本身不在 build/release 依赖链上。
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --desc --progress-spinner off

      - name: Dependency Audit (Frontend)
        # npm audit 在 JS 生态经常有 moderate 级传递依赖告警。同上：本 job
        # 整体非 release-blocking（continue-on-error 在 step 级，job 不在依赖链）。
        continue-on-error: true
        working-directory: ./frontend
        run: npm audit --audit-level=moderate

  # ============ Stage 3c: Release Gate 聚合（显式 release DAG）============
  # 审计 REL-01：此前 build 直接 needs [lint, test-backend, test-frontend, security]，
  # 而 test-perf（"Performance Regression Gate"）与任何 cartography smoke 均不在
  # 依赖链上 —— 性能 HARD REGRESSION 与制图回归可直达 build→deploy-prod。
  # 现以单一聚合 job 把 release-blocking 检查收敛为显式 DAG：
  #   quality + backend + frontend + security + perf + cartography → release-gate → build → deploy
  # 该 job 无 step（只做 needs 聚合），任何被依赖 job 失败即整体失败，
  # 杜绝 continue-on-error / || true / skip 把 required 失败伪装成成功。
  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # #400: deploy-config（nginx -t SSE/keepalive 语法门）必须进入发布 DAG ——
    # 否则坏的 location 正则可以带着绿色 release-gate 上生产。
    # #476: db-migrations（PostGIS 上执行迁移链 + drift check）同理 ——
    # 迁移跑不通 / 模型与迁移漂移的 PR 不能进入 build→deploy。
    # #477: real-services-smoke（真实 PostGIS/Redis/celery 投递 smoke）同理
    # —— prod-backend 回归不能带着绿色 gate 上生产。
    needs: [lint, test-backend, test-frontend, security, test-perf, cartography-smoke, deploy-config, db-migrations, real-services-smoke]
    steps:
      - name: Release gate passed
        run: echo "All release-blocking checks (quality, backend, frontend, security, perf, cartography) passed."

  # ============ Stage 4: 构建镜像 ============
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [release-gate]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # 审计 CICD-02：构建镜像需要 vendor/pi 子模块（否则 source 不完整）。
          submodules: recursive

      - name: Lowercase IMAGE_NAME
        # docker tag 要求全小写；github.repository 可能含大写（如 WindWang2/...）
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{major}}.{{minor}}.{{patch}}

      - name: Build Production Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.prod
          # 不声明 platforms：build-push-action 在 load: true 模式下无法载入多架构
          # manifest 到本地 daemon，arm64 构建会被静默丢弃。如需多架构，需 push: true
          # 配合真实 registry。
          # 审计 CICD-01：保留 load: true 以产出本地镜像供下游 preview/SSH/rollback
          # 通过 docker save -> artifact 流程使用；镜像 push 由下面的 Push step 单独完成
          # （buildx 不允许 load 与 push 同时为 true）。
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push Image to Registry
        # 审计 CICD-01：build job 必须把镜像推到 registry，否则 deploy-prod 的
        # registry 路径（docker pull）无镜像可用。build 步骤因 load:true 无法同时 push，
        # 故在此显式 push 刚 build 出的本地镜像。
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Save Image Artifact
        run: |
          docker save ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            > webgis-image.tar

      - name: Upload Image Artifact
        uses: actions/upload-artifact@v7
        with:
          name: webgis-image
          path: webgis-image.tar
          retention-days: 7

  # ============ Stage 5: 部署预览（Pull Request）==========
  preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [build]
    if: github.event_name == 'pull_request'
    # Comment Preview URL uses github-script to create a PR comment, which
    # needs pull-requests: write. The repo default token didn't grant it
    # (403 "Resource not accessible by integration").
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Checkout Code
        # Start Preview Stack needs repo files that the image artifact
        # doesn't carry: .env.Priv.example (seed for random secrets) and
        # docker-compose.prod.secure.yml. Without checkout the runner's
        # working dir only has the downloaded image tar, so the step failed
        # at "缺少 .env.Priv.example".
        uses: actions/checkout@v7
        with:
          # #520：vendor/pi 是 git submodule（Dockerfile.prod COPY vendor/）。
          # 预览必须校验**完整源码**的产物 —— 与 build job（submodules: recursive）
          # 一致，否则 build 兜底路径会构建缺 vendor/pi 的镜像却静默通过。
          submodules: recursive

      - name: Lowercase IMAGE_NAME
        # #520：docker tag 要求全小写。workflow 级 env.IMAGE_NAME = github.repository
        # 是混合大小写（WindWang2/...），build job 已在自身环境小写化后 docker load
        # 的镜像 tag 是全小写 —— preview 若不小写，compose 引用混合大小写 tag 找不到
        # 已 load 镜像，会静默落入 build 兜底（校验的就不是 CI 产物）。与
        # deploy-prod/rollback 的同名步骤一致。
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Download Image Artifact
        uses: actions/download-artifact@v8
        with:
          name: webgis-image
          path: .

      - name: Load Docker Image
        run: docker load < webgis-image.tar

      - name: Start Preview Stack
        run: |
          # 审计 CICD-04：docker-compose.prod.secure.yml 的 api/celery 都声明
          # `env_file: .env.Priv`，并用 `${DB_PWD:?...}` / `${REDIS_PASSWORD:?...}`
          # / `${JWT_SECRET_KEY:?...}` 强制校验 —— 因此 compose 启动前必须在
          # 工作目录存在 .env.Priv（不是 .env.preview / .env.prod）。
          # .env.Priv.example 已提交，提供占位凭据；此处复制并填入随机值，
          # 避免预览栈用默认弱口令。
          if [ ! -f .env.Priv.example ]; then
            echo "缺少 .env.Priv.example，无法生成预览环境凭据" >&2
            exit 1
          fi
          cp .env.Priv.example .env.Priv

          # 预览实例用随机强口令，并隔离 DB 名避免与生产混淆。
          # LLM_API_KEY 也是必填：config.py 生产模式缺失时会抛 RuntimeError，
          # api 直接启动失败（预览不做真实 LLM 调用，随机值即可）。
          RANDOM_DB_PWD=$(openssl rand -hex 24)
          RANDOM_REDIS_PWD=$(openssl rand -hex 24)
          RANDOM_JWT=$(openssl rand -hex 32)
          RANDOM_LLM_KEY=$(openssl rand -hex 24)
          sed -i \
            -e "s|^DB_PWD=.*|DB_PWD=${RANDOM_DB_PWD}|" \
            -e "s|^REDIS_PASSWORD=.*|REDIS_PASSWORD=${RANDOM_REDIS_PWD}|" \
            -e "s|^JWT_SECRET_KEY=.*|JWT_SECRET_KEY=${RANDOM_JWT}|" \
            -e "s|^LLM_API_KEY=.*|LLM_API_KEY=${RANDOM_LLM_KEY}|" \
            -e "s|^WEBGIS_IMAGE=.*|WEBGIS_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|" \
            .env.Priv

          # settings.CORS_ORIGINS 是 List[str]，环境变量必须是 JSON 数组格式
          # （模板默认值已是合法 JSON，纯字符串会让 api 在 pydantic 解析时
          # 启动失败）。预览仅在一次性 runner 上运行、无外部访问，保留模板
          # 默认 allow-list 即可，无需 sed。

          # redis 加载 deploy/redis.conf（避免 docker compose 在 runner 上把
          # list-form command 合并成单字符串导致的配置解析错误）。requirepass
          # 不存于配置文件中，由容器 entrypoint（deploy/redis-entrypoint.sh）
          # 从 REDIS_PASSWORD 环境变量注入——即上面写入 .env.Priv 的随机口令，
          # 经 --env-file 传给容器。无需在此 sed 修改任何文件。

          # nginx.conf 监听 443 端口并需要 /etc/nginx/ssl/server.crt 和
          # .key 文件。deploy/nginx/ssl 目录并未被追踪（证书不属于仓库内容），
          # 因此 docker 会自动将其创建为一个空目录，导致 nginx 启动失败。
          # 为预览环境（仅限 localhost）生成一个自签名证书。
          mkdir -p deploy/nginx/ssl
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout deploy/nginx/ssl/server.key \
            -out deploy/nginx/ssl/server.crt \
            -subj "/CN=localhost" >/dev/null 2>&1

          # #520：compose 的 image: ${WEBGIS_IMAGE:-webgis-ai-agent:local} 必须解析到
          # 本步骤开头 docker load 出的 ghcr.io/<repo>:<sha> 镜像 —— 上面 sed 已把
          # 模板里的 WEBGIS_IMAGE 替换为该 tag。否则 compose 落入 build 兜底，在
          # runner 上从源码重建，校验的就不是 CI 构建产物（且缺 vendor/pi）。
          # 此前的 IMAGE_TAG 步骤环境变量只出现在 PR 评论文本里，从未被消费，已删。

          # docker compose resolves ${DB_PWD:?...} / ${REDIS_PASSWORD:?...} /
          # ${JWT_SECRET_KEY:?...} from the shell env OR its --env-file. The
          # api/celery services load .env.Priv via `env_file:`, but db/redis
          # rely on interpolation - so without --env-file the step failed at
          # "required variable DB_PWD is missing a value". Point compose at
          # .env.Priv explicitly (its default is plain `.env`).
          docker compose --env-file .env.Priv -f docker-compose.prod.secure.yml up -d

      - name: Verify Preview Stack Health
        run: |
          # 预览栈在一次性 runner 上启动，无公网地址（PR 读者浏览器里的
          # localhost 指向读者本机）。真实验证：在 runner 上经 nginx 发布
          # 的端口探测——80 强制 301 到 443（自签名证书，curl 用 -k）；
          # /health 是 nginx 自身端点，/api/v1/health/live 经反代到 api。
          ok=0
          for i in $(seq 1 30); do
            if curl -sfk https://localhost/health >/dev/null 2>&1 && \
               curl -sfk https://localhost/api/v1/health/live >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 6
          done
          if [ "$ok" != "1" ]; then
            echo "preview stack not healthy after retries"
            docker compose --env-file .env.Priv -f docker-compose.prod.secure.yml ps
            echo "--- api logs ---"
            docker compose --env-file .env.Priv -f docker-compose.prod.secure.yml logs --tail=30 api
            echo "--- nginx logs ---"
            docker compose --env-file .env.Priv -f docker-compose.prod.secure.yml logs --tail=30 nginx
            exit 1
          fi
          echo "preview stack healthy (nginx + api via https://localhost)"

      - name: Comment Preview URL
        uses: actions/github-script@v8
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          script: |
            const commentBody = `
            ✅ **Deploy Preview: 栈已启动并通过健康检查**

            - 预览栈在一次性 CI runner 上启动，nginx / api 健康检查通过
            - 仅供 CI 验证，**无公开访问地址**（runner 的 localhost 不指向阅读者本机）

            镜像: ${ process.env.IMAGE_TAG }
            `;

            // 显式传 owner/repo: 之前只传 issue_number + body 时，octokit
            // 的 context.repo 为空（repos///issues/... -> 404）。
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: context.issue.number,
              body: commentBody
            });

  # ============ Stage 6: 生产部署（仅 main 分支）==========
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [build]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        # Deploy to Server via SSH 依赖工作目录里的仓库文件（compose、
        # deploy/redis.conf、deploy/redis-entrypoint.sh、.env.Priv.example）——
        # 该 job 之前没有 checkout，导致 scp 找不到文件。
        uses: actions/checkout@v7

      - name: Lowercase IMAGE_NAME
        # 审计：全局 env.IMAGE_NAME = ${{ github.repository }} 是混合大小写
        # （WindWang2/...），但 docker tag/manifest 要求全小写。build job 和
        # rollback job 各自有此步骤，deploy-prod 之前漏了 —— 导致 manifest
        # inspect 查的是 WindWang2/... 而 registry 里是 windwang2/...，找不到。
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Download Image Artifact
        uses: actions/download-artifact@v8
        with:
          name: webgis-image
          path: .

      - name: Load Docker Image
        run: docker load < webgis-image.tar

      - name: Login to Container Registry
        # 审计 CICD-01：deploy-prod 需要 registry 读权限以校验镜像可达（manifest inspect）
        # 以及供回滚流程 pull。用 GITHUB_TOKEN（与 build job 一致），无需额外 secret。
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure SSH Access
        if: vars.SSH_HOST != ''
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Server via SSH
        if: vars.SSH_HOST != ''
        # 前置要求：SSH_HOST var + SSH_PRIVATE_KEY / DB_PWD / REDIS_PASSWORD /
        # JWT_SECRET_KEY secrets 均已配置。.env.Priv 由共享脚本
        # deploy/ci-generate-env-priv.sh 从这些 secret 生成：任一凭据缺失时
        # 写出空行，compose 的 ${DB_PWD:?...} 等插值会在 up 时快速失败——
        # 绝不部署弱口令或模板占位符。
        env:
          DB_PWD: ${{ secrets.DB_PWD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
        run: |
          sh deploy/ci-generate-env-priv.sh
          # redis 服务挂载 deploy/redis.conf + deploy/redis-entrypoint.sh，
          # 必须随 compose 一起推送到主机（否则 bind mount 指向不存在路径，
          # redis 启动失败）。
          ssh ${{ vars.SSH_HOST }} 'mkdir -p ~/deploy'
          scp docker-compose.prod.secure.yml ${{ vars.SSH_HOST }}:~/
          scp deploy/redis.conf deploy/redis-entrypoint.sh ${{ vars.SSH_HOST }}:~/deploy/
          # #530：prometheus 服务 bind-mount ./deploy/prometheus.yml 与
          # ./deploy/alerts-rules.json —— 不随部署送达主机时，Docker 把缺失的
          # 挂载源创建为空目录，prometheus 把目录当 config 加载即 crash-loop、
          # 告警全哑（nginx 在 #472 已内联修复，prometheus 走 scp 传输）。
          scp deploy/prometheus.yml deploy/alerts-rules.json ${{ vars.SSH_HOST }}:~/deploy/
          scp .env.Priv ${{ vars.SSH_HOST }}:~/
          scp webgis-image.tar ${{ vars.SSH_HOST }}:~/

          ssh ${{ vars.SSH_HOST }} << 'EOF'
            docker load < ~/webgis-image.tar
            # redis requirepass 由容器 entrypoint 从环境注入，无需额外渲染；
            # 但 db/redis 的 ${DB_PWD:?...} / ${REDIS_PASSWORD:?...} 插值依赖
            # compose 从 --env-file 读到变量（默认 .env 指向普通开发文件）。
            docker compose --env-file .env.Priv -f docker-compose.prod.secure.yml up -d
            docker system prune -f
          EOF

      - name: Confirm Image Available in Registry
        if: vars.SSH_HOST == ''
        # 审计 CICD-01：build job 的 "Push Image to Registry" step 已用 GITHUB_TOKEN
        # 把镜像推到 registry。此分支（SSH_HOST 未配置 = 无生产主机）无需部署动作，
        # 仅校验镜像 tag 在 registry 可达，供下游手动 `docker pull` 或回滚流程使用。
        # 之前这里用 REGISTRY_TOKEN secret（不存在）重复 push —— 冗余且因空 token 导致
        # 非 TTY 登录失败。改为只读校验。
        run: |
          if docker manifest inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} > /dev/null 2>&1; then
            echo "✅ 镜像已在 registry: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
            echo "   下游手动部署：docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          else
            echo "❌ 镜像不在 registry —— build job 的 'Push Image to Registry' step 可能失败"
            echo "   registry: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
            exit 1
          fi

      - name: Health Check
        run: |
          sleep 30
          # 之前直接 curl GitHub Actions runner 的 localhost —— 那是 runner，不是生产主机。
          # 改为通过 SSH 在生产主机上打健康检查（端点 /api/v1/health/live 现已存在）。
          if [ -n "${{ vars.SSH_HOST }}" ]; then
            ssh ${{ vars.SSH_HOST }} 'curl -sf http://localhost:8000/api/v1/health/live || exit 1'
          else
            echo "SSH_HOST 未配置，跳过远程健康检查"
          fi

      - name: Notify Success
        if: vars.FEISHU_WEBHOOK_URL != ''
        run: |
          curl -X POST '${{ vars.FEISHU_WEBHOOK_URL }}' \
            -H 'Content-Type: application/json' \
            -d '{
              "msg_type": "text",
              "content": {
                "text": "🚀 WebGIS 生产环境部署成功\n- SHA: ${{ github.sha }}\n- 作者: ${{ github.actor }}"
              }
            }'

  # ============ Stage 7: 回滚（手动触发）==========
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'
    environment: production
    permissions:
      contents: read
      packages: read  # 审计 CICD-03：从 ghcr 拉取历史 SHA tag 需要 packages: read
    steps:
      # 审计 CICD-03：之前 rollback checkout PREV_SHA + docker build from source ——
      # 慢（10+ 分钟）+ 不可重现（依赖可能 drift）+ 可能因依赖变化 build 失败。
      # 现改为：优先 docker pull registry 中该 commit 对应的 SHA tag（秒级、不可变）；
      # 仅当 registry 没有该 tag（部署早于本流水线的 push 步骤上线）时，才回退到从
      # pinned source 重新构建。SSH 分支与 deploy-prod 保持一致。
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 20  # 拿足够 history 找上一个稳定 commit

      - name: Lowercase IMAGE_NAME
        # docker tag 要求全小写；github.repository 可能含大写（见 build job 同名 step）
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Find Previous Stable Commit
        run: |
          # 跳过当前 HEAD，找上一个 merge commit（通常是稳定 PR 合并点）
          PREV_SHA=$(git log --merges --skip=1 -n 1 --format='%H')
          if [ -z "$PREV_SHA" ]; then
            # 没 merge commit，fallback 到 HEAD^
            PREV_SHA=$(git rev-parse HEAD^)
          fi
          echo "PREV_SHA=$PREV_SHA" >> $GITHUB_ENV
          echo "将回滚到: $PREV_SHA"
          git log --oneline -1 $PREV_SHA

      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Previous Image from Registry
        id: pull
        continue-on-error: true
        run: |
          # 审计 CICD-03：build job 已 push ${IMAGE_NAME}:${{ github.sha }} 到 registry，
          # 故历史 commit PREV_SHA 同样应存在对应 SHA tag（若当时也走了本流水线）。
          # 用不可变 artifact 回滚，而非重新 docker build。
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.PREV_SHA }}
          # 打 :rollback tag 供下游 deploy 步骤统一引用（与原 deploy 流程镜像名对齐）。
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.PREV_SHA }} \
                     ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:rollback

      - name: Fallback - Checkout Previous Version
        # 审计 CICD-03：registry 中无 PREV_SHA tag（部署早于 push 步骤上线）时，
        # 退化为从 pinned source 重建 —— 至少 source 是 pin 到 PREV_SHA 的。
        if: steps.pull.outcome == 'failure'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PREV_SHA }}
          fetch-depth: 1
          # 审计 CICD-02：历史版本构建同样需要 vendor/pi 子模块。
          submodules: recursive

      - name: Fallback - Rebuild Previous Image
        if: steps.pull.outcome == 'failure'
        run: |
          echo "⚠️ registry 中未找到 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.PREV_SHA }}，回退从源码构建"
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:rollback -f Dockerfile.prod .

      - name: Configure SSH Access
        if: vars.SSH_HOST != ''
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy Rollback via SSH
        if: vars.SSH_HOST != ''
        # 与 deploy-prod 一致：把 compose + .env.Priv + redis 配置 + 镜像推到生产主机再 up。
        # .env.Priv 由共享脚本从 secrets 生成（缺失时留空行，compose 的
        # ${VAR:?...} 快速失败）。回退构建路径检出 PREV_SHA，可能早于脚本
        # 存在——此时用等价的 printf 兜底。
        env:
          DB_PWD: ${{ secrets.DB_PWD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          # #520：compose 的 api/celery 用 `image: ${WEBGIS_IMAGE:-webgis-ai-agent:local}`
          # 插值，必须解析到主机上 docker load 出的镜像 tag。回滚镜像（registry pull
          # 或源码 rebuild）统一打为 :rollback（见上方 Pull/Rebuild 步骤）。显式导出
          # 让共享脚本 ci-generate-env-priv.sh 的"已导出 WEBGIS_IMAGE 优先"分支写入
          # .env.Priv。此前未导出 → 脚本回落到 GITHUB_SHA = 当前坏 HEAD，回滚实际
          # 重跑了坏镜像。
          WEBGIS_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:rollback
        run: |
          if [ -f deploy/ci-generate-env-priv.sh ]; then
            sh deploy/ci-generate-env-priv.sh
          else
            printf 'DB_PWD=%s\nREDIS_PASSWORD=%s\nJWT_SECRET_KEY=%s\nLLM_API_KEY=%s\nCORS_ORIGINS=%s\n' \
              "$DB_PWD" "$REDIS_PASSWORD" "$JWT_SECRET_KEY" "$LLM_API_KEY" \
              "${CORS_ORIGINS:-[\"https://your-domain.com\"]}" > .env.Priv
            # 回退树（早于脚本）同样必须写入 WEBGIS_IMAGE，否则 compose 落到
            # webgis-ai-agent:local（主机上无该 tag）→ up 失败。
            printf 'WEBGIS_IMAGE=%s\n' "$WEBGIS_IMAGE" >> .env.Priv
          fi
          docker save ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:rollback > /tmp/rollback-image.tar
          ssh ${{ vars.SSH_HOST }} 'mkdir -p ~/deploy'
          scp docker-compose.prod.secure.yml ${{ vars.SSH_HOST }}:~/
          # 回退构建路径（Fallback - Checkout Previous Version）检出的是 PREV_SHA，
          # 可能早于 redis.conf / redis-entrypoint.sh 的存在（本分支新增），且该
          # 路径的旧 compose 也不挂载 redis 配置——文件缺失时跳过 scp。
          for f in deploy/redis.conf deploy/redis-entrypoint.sh; do
            [ -f "$f" ] && scp "$f" ${{ vars.SSH_HOST }}:~/deploy/
          done
          # #530：与 deploy-prod 一致，prometheus 配置必须随回滚送达主机（否则
          # 空目录 bind-mount 让 prometheus crash-loop）。回退构建路径检出的
          # PREV_SHA 可能早于这些文件，同样用存在性守卫跳过。
          for f in deploy/prometheus.yml deploy/alerts-rules.json; do
            [ -f "$f" ] && scp "$f" ${{ vars.SSH_HOST }}:~/deploy/
          done
          scp .env.Priv ${{ vars.SSH_HOST }}:~/
          scp /tmp/rollback-image.tar ${{ vars.SSH_HOST }}:~/

          ssh ${{ vars.SSH_HOST }} << 'EOF'
            docker load < ~/rollback-image.tar
            docker compose --env-file .env.Priv -f docker-compose.prod.secure.yml up -d
            docker system prune -f
          EOF

      - name: Deploy Rollback via Container Registry
        if: vars.SSH_HOST == ''
        run: |
          # 无 SSH_HOST：镜像（pull 或 rebuild 得到）push 到 registry，目标主机自行 pull。
          # （同 deploy-prod 的 registry 分支：实际服务器 pull/up 步骤需在目标主机执行。）
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:rollback

      - name: Verify Rollback
        run: |
          sleep 30
          # 同 deploy-prod：通过 SSH 在生产主机上验证（端点现已存在）。
          if [ -n "${{ vars.SSH_HOST }}" ]; then
            ssh ${{ vars.SSH_HOST }} 'curl -sf http://localhost:8000/api/v1/health/live'
          else
            echo "SSH_HOST 未配置，跳过远程健康检查"
          fi