# V9 契约基石（ADR-0138）：contract lane
# 与 production.yml 主 lane 解耦 —— 本文件独立，主 lane 零改动。
# 覆盖面：response_model 覆盖率门禁 / 字段级契约闸 / api-docs drift /
# schemathesis 模糊 shard / OpenAPI 快照（含 additive 刷新纪律）。
name: contract

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# ISSUE-035 对齐：顶层最小权限 —— 本 lane 全部步骤（含失败时的 artifact
# 上传，走 runtime token）只需 contents: read，与 production.yml 同姿态。
permissions:
  contents: read

# G15：补齐与 production.yml / quality-e2e.yml 对齐的顶层并发治理。
# 同一分支/PR 的过时 run 直接取消，避免 contract lane 重复流水线堆积；
# 仅取消 PR —— master push 与手动触发不取消（与 production.yml 的写法
# 一致：在途 run 绝不能被并发组杀掉）。
# #1694 OPS-14：group 补 event_name（production.yml:49 同款）—— 缺它时同一
# ref 的手动触发与 PR/push run 共组，可被静默取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # #1558 环境漂移防护：contract lane 是唯一轻量到可加矩阵的 Python 入口 ——
    # 主 lane（production.yml）15 个 job 共享 env.PYTHON_VERSION=3.12 不动。
    # 3.13 覆盖开发机实际版本；requires-python 上界 <3.14 见 pyproject.toml。
    # #1657 已知局限（3.12/3.13 解析关系）：requirements.lock 由
    # `uv pip compile requirements.txt --python-version 3.12` 生成，全文件
    # 0 条 python_version marker —— 两条矩阵腿（3.12 / 3.13）共用同一份
    # 3.12 解析结果安装（-c requirements.lock）。当前两腿实测绿，但一旦某
    # 个 pin 换成无 cp313/abi3 wheel 的二进制包，3.13 腿会以难以归因的方式
    # 失败。后续若重编译 lock，应评估 `--universal`（生成 python_version
    # marker 的双版本解析）或给 3.13 腿单独编译约束文件。
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install deps
        run: pip install -c requirements.lock -r requirements-dev.txt -r requirements.txt schemathesis httpx

      - name: OpenAPI snapshot (no breaking changes, additive needs explicit refresh)
        run: pytest tests/quality/test_api_compatibility.py -q
        env:
          JWT_SECRET_KEY: ci-contract-lane-secret

      - name: Field-level contract gate (#1217)
        run: pytest tests/unit/api_contract/test_field_contract.py -q
        env:
          JWT_SECRET_KEY: ci-contract-lane-secret

      - name: response_model coverage + schema gates
        run: pytest tests/unit/api_contract -q --ignore=tests/unit/api_contract/test_schemathesis.py
        env:
          JWT_SECRET_KEY: ci-contract-lane-secret

      - name: Endpoint scope matrix --check + auth flags (#1417)
        run: |
          python scripts/generate_endpoint_scope_matrix.py --check
          pytest tests/test_endpoint_scope_matrix.py -q
        env:
          JWT_SECRET_KEY: ci-contract-lane-secret

      - name: api-docs drift gate
        run: pytest tests/test_api_docs_drift.py -q
        env:
          JWT_SECRET_KEY: ci-contract-lane-secret

      # #1684（API-01 ①）：realtime 契约闸（WS/SSE 快照字节一致 + 分类器
      # 自测）此前零接线 —— 全仓 grep realtime 在 .github/ 下 0 命中，
      # realtime-contract.json 是只在全量后端 lane 间接收集的快照（缺快信号
      # 面）。接入 contract lane 后删 WS 认证语义锚 / 删 SSE done 事件 /
      # 漏登记新 SSE 事件名都会在此 10 秒内现形。
      - name: Realtime contract snapshot (WS/SSE, ADR-0245 W6)
        run: pytest tests/quality/test_realtime_contract.py -q
        env:
          JWT_SECRET_KEY: ci-contract-lane-secret

      - name: Schemathesis fuzz shard (max_examples=30, allowlisted paths)
        run: pytest tests/unit/api_contract/test_schemathesis.py -q
        env:
          JWT_SECRET_KEY: ci-contract-lane-secret

      - name: Upload field snapshot on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: api-contract-fields-snapshot
          path: tests/quality/snapshots/api_contract_fields.json
          if-no-files-found: ignore
