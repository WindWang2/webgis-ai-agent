# Dependabot 配置 — 审计 I28
# 之前没有 dependabot.yml，pip-audit / npm audit 只在 CI 跑（reactive），
# 不会主动开 PR 升级有 CVE 的依赖。这里覆盖 4 个 ecosystem，weekly 节奏。

version: 2
updates:
  # Python 后端依赖
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    # 审计 CICD-05：把 minor/patch 升级合并到一个 PR，减少 PR 噪声。
    # major 升级仍各自独立成 PR（breaking change 需单独评估）。
    groups:
      python-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # 前端依赖
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    # 审计 CICD-05：同 pip，minor/patch 批量化。
    groups:
      npm-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"

  # GitHub Actions 自身
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
