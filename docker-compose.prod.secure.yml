# ============================================================
# WebGIS AI Agent 生产环境 Docker Compose（安全远程部署版）
# 
# 特点：
# - 数据库和 Redis 仅容器内部网络通信，不暴露端口
# - 适合部署到拥有公网 IP 的服务器
# - 可配合 Nginx 反向代理使用 HTTPS
#
# 使用: docker-compose -f docker-compose.prod.secure.yml up -d
#
# ⚠️ 部署前必须创建 .env.Priv 文件（见 .env.Priv.example 模板）。
#
# #472 部署契约（deploy-prod 只 scp 本文件 + deploy/redis*.conf + 镜像 tar +
# .env.Priv 到主机，主机上没有源码/构建上下文）：
# - api / celery-worker 的镜像经 ${WEBGIS_IMAGE:-webgis-ai-agent:local} 引用：
#   CI 侧 deploy/ci-generate-env-priv.sh 把 WEBGIS_IMAGE=ghcr.io/<repo>:<sha>
#   写入 .env.Priv（与 docker load 出的 tar 同名），compose --env-file 解析；
#   本地检出则保留 build: 回退（打为 webgis-ai-agent:local）。
# - nginx 的配置/证书用内联 configs 分发（见文件尾 configs:），不依赖任何
#   未随部署分发的 bind-mount 路径。真实证书：复制本文件为 override，把
#   webgis_ssl_scaffold_cert / webgis_ssl_scaffold_key 两个 config 换成
#   `file: ./deploy/nginx/ssl/server.crt` 形式的源，并
#   `docker compose -f docker-compose.prod.secure.yml -f <override> up -d`。
# ============================================================

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: webgis-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-webgis_prod}
      # 审计 P0：明确提示从 .env.Priv 读取，不存在时拒绝启动而非使用弱默认值。
      POSTGRES_PASSWORD: "${DB_PWD:?ERROR: DB_PWD not set. Copy .env.Priv.example to .env.Priv and set DB_PWD.}"
      POSTGRES_DB: ${DB_NAME:-webgis_prod}
      # 审计 I20：之前缺 PGDATA，Postgres 直接初始化在 mount 根 ->
      # lost+found 冲突 / 权限问题。与 prod.yml 一致加 PGDATA 子目录。
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pg_data_secure:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-webgis_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - webgis-internal
    # 生产环境：不暴露端口，仅通过内部网络
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2.0"
        reservations:
          memory: 2g
          cpus: "1.0"

  redis:
    image: redis:7-alpine
    container_name: webgis-prod-redis
    restart: unless-stopped
    # Load config from a mounted file rather than CLI args. On GitHub Actions
    # runners, docker compose's list-form `command:` was serialized into a
    # single string that redis-server then tried to parse as a config file
    # (FATAL CONFIG FILE ERROR >>> 'appendonly "--maxmemory" "256mb"').
    # The config-file path is unambiguous: redis-server treats the first
    # non-flag arg as a config file, which is exactly what we want here.
    # requirepass is NOT stored in deploy/redis.conf (audit I4/I6); the
    # entrypoint script below injects it from the REDIS_PASSWORD env var, so
    # local compose, CI preview, and prod SSH deploys all behave identically.
    entrypoint: ["/bin/sh", "/usr/local/etc/redis/entrypoint.sh"]
    # Expose REDIS_PASSWORD to the container env so the entrypoint can set
    # requirepass and the healthcheck (below) can resolve $$REDIS_PASSWORD.
    # `:?` fails fast when the var is missing, like the other services here.
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?ERROR: REDIS_PASSWORD not set. Copy .env.Priv.example to .env.Priv and set REDIS_PASSWORD.}"
    volumes:
      - ./deploy/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./deploy/redis-entrypoint.sh:/usr/local/etc/redis/entrypoint.sh:ro
      - redis_data_secure:/data
    healthcheck:
      # 用 REDISCLI_AUTH 传密码，避免 -a 把密码暴露在进程列表 / shell history。
      # $$ 转义让 compose 不展开，运行时由容器 shell 解析 $REDIS_PASSWORD。
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - webgis-internal
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
        reservations:
          memory: 512m
          cpus: "0.25"

  api:
    # #472: 镜像优先、build 兜底。deploy-prod 主机上没有构建上下文 —— 仅
    # build: 会让 `up` 构建失败（或静默复用过期本地镜像，CI 加载的 tar 从未被
    # 引用）。WEBGIS_IMAGE 由 deploy/ci-generate-env-priv.sh 在 CI 写入
    # .env.Priv，与 docker load 出的 ghcr.io/<repo>:<sha> 完全一致；本地检出
    # 未设 WEBGIS_IMAGE 时走 build:（镜像打为 webgis-ai-agent:local）。
    image: ${WEBGIS_IMAGE:-webgis-ai-agent:local}
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: webgis-prod-api
    restart: unless-stopped
    environment:
      ENV: production
      RAG_EMBEDDING_OFFLINE: "true"  # #662: 离线加载 embedding 模型（缓存预置见 docs/DEPLOYMENT.md）
      DEBUG: "false"
      DATABASE_URL: "postgresql://${DB_USER:-webgis_prod}:${DB_PWD}@db:5432/${DB_NAME:-webgis_prod}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?ERROR: JWT_SECRET_KEY not set. Set it in .env.Priv.}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?ERROR: REDIS_PASSWORD not set. Copy .env.Priv.example to .env.Priv}@redis:6379/0"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD:?ERROR: REDIS_PASSWORD not set. Copy .env.Priv.example to .env.Priv}@redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD:?ERROR: REDIS_PASSWORD not set. Copy .env.Priv.example to .env.Priv}@redis:6379/1"
      CORS_ORIGINS: "${CORS_ORIGINS}"
      LOG_LEVEL: INFO
      # #519: DATA_DIR=/app/data —— 整个数据目录（uploads/analysis_results/
      # monitoring_reports/exports/.pi_bridge_secret）落在共享命名卷 webgis_data
      # （api 与 celery-worker 挂同一卷），跨容器路径一致。
      DATA_DIR: /app/data
    env_file:
      - .env.Priv
    # #472: 健康检查必须在主机上可达。之前只有 expose（仅容器网络内可见），
    # deploy-prod 在主机上 curl http://localhost:8000/... 必然 connection
    # refused（或被无关的 :8000 占用者误判为绿）。改为发布到主机 loopback ——
    # 公网入口仍然只有 nginx 的 80/443，与 db/redis 不暴露端口的姿态一致。
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # #519: 共享命名卷覆盖整个 DATA_DIR（/app/data）。uploads 由应用解析到
      # DATA_DIR/uploads（get_upload_dir → Path(DATA_DIR)/"uploads"/<id>），
      # 与分析结果/报告/导出同卷 —— 与 celery-worker 同一卷同一路径。
      - webgis_data:/app/data
    # 审计 P0：api healthcheck 使用 wget，但 Dockerfile.prod runner 不装 wget。
    # 改用 python3 urllib（已修复 Dockerfile.prod HEALTHCHECK，此处同步）。
    # #474：compose 的 service healthcheck 会完全覆盖镜像 HEALTHCHECK —— 之前
    # 这里只探 uvicorn:8000，与 #400 的双进程镜像 HEALTHCHECK 相比是退化：
    # node frontend/.next/standalone/server.js 挂掉时容器仍"healthy"，nginx
    # 对 / 502 而编排层（depends_on/CI 探针）毫无感知。与镜像保持一致的双探测。
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/health/live', timeout=5); u.urlopen('http://localhost:3000/', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - webgis-internal
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 1g
          cpus: "0.5"

  celery-worker:
    # #472: 与 api 相同的镜像引用契约（见 api 服务的注释）。
    image: ${WEBGIS_IMAGE:-webgis-ai-agent:local}
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: webgis-prod-celery
    restart: unless-stopped
    environment:
      ENV: production
      RAG_EMBEDDING_OFFLINE: "true"  # #662: 离线加载 embedding 模型（缓存预置见 docs/DEPLOYMENT.md）
      DATABASE_URL: "postgresql://${DB_USER:-webgis_prod}:${DB_PWD}@db:5432/${DB_NAME:-webgis_prod}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:?ERROR: REDIS_PASSWORD not set. Copy .env.Priv.example to .env.Priv}@redis:6379/0"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD:?ERROR: REDIS_PASSWORD not set. Copy .env.Priv.example to .env.Priv}@redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD:?ERROR: REDIS_PASSWORD not set. Copy .env.Priv.example to .env.Priv}@redis:6379/1"
      # #476：镜像 entrypoint 现在会先跑 alembic upgrade head —— api 与
      # celery-worker 同时 up 会并发 upgrade 竞争 alembic_version 表。
      # 迁移的唯一所有者是 api 容器；worker 跳过。
      SKIP_DB_MIGRATIONS: "true"
      # #519: 与 api 同一 DATA_DIR（/app/data）+ 同一共享卷 webgis_data ——
      # worker 写 analysis_results/monitoring_reports 落共享卷，api 按 DATA_DIR
      # 下发同卷路径。默认 "./data" 在 WORKDIR /app/backend 下展开 → worker 写
      # /app/backend/data/... 而 api 从 /app/... 下发，产物跨容器 404。
      DATA_DIR: /app/data
    env_file:
      - .env.Priv
    command: celery -A app.services.task_queue worker --loglevel=info --concurrency=2
    volumes:
      # #471+#519：worker 必须与 api 看到同一批文件（celery 任务按本地路径打开
      # raster/shapefile 与写产物）。挂同一个 webgis_data 卷到同一 DATA_DIR 路径
      # —— 上传、分析结果、报告全部共享；否则上传成功/产物登记的分析任务在
      # worker 侧"No such file"，api 侧 404。
      - webgis_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - webgis-internal
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 1g
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.services.task_queue inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Nginx 反向代理（HTTPS 终止）
  nginx:
    image: nginx:1.27-alpine
    container_name: webgis-prod-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx_logs_secure:/var/log/nginx
    # #472: nginx 配置与证书随本文件内联分发（见文件尾 configs:）。之前
    # bind-mount ./deploy/nginx/nginx.conf 与 ./deploy/nginx/ssl —— 两者都不在
    # deploy-prod 的 scp 清单里（ssl 甚至未被 git 追踪），Docker 会把缺失的
    # 挂载源创建为空目录，nginx 启动即死（"nginx.conf failed: Is a directory"）。
    # 内容与 deploy/nginx/nginx.conf 逐字节一致，由
    # tests/test_nginx_security.py 的 parity 测试强制防漂移。真实证书的替换
    # 方式见文件头注释。
    configs:
      - source: webgis_nginx_conf
        target: /etc/nginx/nginx.conf
      - source: webgis_ssl_scaffold_cert
        target: /etc/nginx/ssl/server.crt
      - source: webgis_ssl_scaffold_key
        target: /etc/nginx/ssl/server.key
    depends_on:
      - api
    networks:
      - webgis-internal
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
        reservations:
          memory: 128m
          cpus: "0.1"

  # Prometheus 监控（如需要）
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: webgis-prod-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts-rules.json:/etc/prometheus/alerts-rules.json:ro
      - prometheus_data_secure:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - webgis-internal
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
        reservations:
          memory: 512m
          cpus: "0.25"

  # PostgreSQL exporter（#473：pg_up 的数据源 —— Database_Connection_Failure
  # 告警之前引用 pg_up 但没有任何 exporter 被抓取，是永不触发的装饰性监控）
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: webgis-prod-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER:-webgis_prod}:${DB_PWD:?ERROR: DB_PWD not set. Copy .env.Priv.example to .env.Priv and set DB_PWD.}@db:5432/${DB_NAME:-webgis_prod}?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - webgis-internal
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
        reservations:
          memory: 128m
          cpus: "0.1"

  # Redis exporter（#473：redis_memory_* / redis_key_size 的数据源 ——
  # Redis_Memory_High 与 Celery_Task_Backlog 告警）。check-keys=celery 导出
  # celery 默认队列（Redis list key "celery"）长度为 redis_key_size。
  redis-exporter:
    image: quay.io/prometheuscommunity/redis-exporter:v1.58.0
    container_name: webgis-prod-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:?ERROR: REDIS_PASSWORD not set. Copy .env.Priv.example to .env.Priv and set REDIS_PASSWORD.}"
      REDIS_EXPORTER_CHECK_KEYS: celery
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - webgis-internal
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
        reservations:
          memory: 128m
          cpus: "0.1"

  # Node exporter（#473：node_filesystem_* 的数据源 —— Disk_Space_Low 告警）。
  # 只读挂载宿主 /proc /sys /，监控容器所在宿主机（Linux）的根文件系统。
  node-exporter:
    image: quay.io/prometheuscommunity/node-exporter:v1.7.0
    container_name: webgis-prod-node-exporter
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    networks:
      - webgis-internal
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
        reservations:
          memory: 128m
          cpus: "0.1"

volumes:
  pg_data_secure:
  redis_data_secure:
  nginx_logs_secure:
  prometheus_data_secure:
  # #519: 共享数据卷 —— 覆盖 api + celery-worker 的 DATA_DIR（/app/data）。
  # 迁移注意：旧栈的 uploads 卷（原挂 /app/uploads）数据不会自动搬过来，
  # 如需保留历史上传，把旧卷内容拷入本卷的 uploads/ 子目录。
  webgis_data:

networks:
  webgis-internal:
    driver: bridge

# ============================================================================
# #472: 内联分发的 nginx 传输配置与 TLS scaffold（部署工件自包含）。
# deploy-prod 只把 compose 文件 + deploy/redis*.conf + 镜像 tar + .env.Priv
# scp 到主机 —— nginx 的配置/证书不能再依赖未随部署分发的 bind-mount 路径。
# 真实证书替换方式见文件头注释。
# 注意：content 内的 nginx 变量（$remote_addr 等）必须双写为 $$ —— compose
# 渲染时会把单 $ 视作插值变量并置空；parity 测试按 $$→$ 还原后比对。
# ============================================================================
configs:
  webgis_nginx_conf:
    # 与 deploy/nginx/nginx.conf 逐字节一致（$$ 按 compose 转义规则双写）；
    # parity 由 tests/test_nginx_security.py 强制（deploy-config CI 门的
    # nginx -t 只校验仓库文件，此内联副本靠 parity 测试锁定同一份语法/语义）。
    content: |
      # ============================================================
      # WebGIS AI Agent 生产环境 Nginx 配置
      # 支持 HTTPS、静态资源缓存、API 路由转发、CORS 处理
      # ============================================================

      # 运行用户
      user nginx;
      worker_processes auto;
      error_log /var/log/nginx/error.log warn;
      pid /var/run/nginx.pid;

      events {
          worker_connections 1024;
          use epoll;
          multi_accept on;
      }

      http {
          # CORS allow-list: only echo approved origins
          map $$http_origin $$allowed_origin {
              default "";
              "~^https://your-domain\.com$$" $$http_origin;
              "~^https://www\.your-domain\.com$$" $$http_origin;
              "~^http://localhost:" $$http_origin;
          }

          # Connection upgrade map (transport goal E-F-7/E-F-8): canonical nginx
          # pattern so non-upgrade requests keep upstream connections reusable.
          # Without this, every proxied request opened a fresh TCP connection to
          # uvicorn/node (the `keepalive 32/16` directives were a no-op because no
          # location ever cleared the Connection header, and `location /` hard-coded
          # `Connection 'upgrade'` for all frontend traffic).
          map $$http_upgrade $$connection_upgrade {
              default upgrade;
              ''      close;
          }

          include /etc/nginx/mime.types;
          default_type application/octet-stream;

          # 日志格式
          log_format main '$$remote_addr - $$remote_user [$$time_local] "$$request" '
                          '$$status $$body_bytes_sent "$$http_referer" '
                          '"$$http_user_agent" "$$http_x_forwarded_for"';

          # #757: WS 位置专用 —— $$request_no_query 把请求行里的 query string 剥掉，
          # 防止 ?token=<JWT> 随 $$request 写入访问日志。
          map $$request $$request_no_query {
              ~^(?<req_method>[^ ]+) (?<req_path>[^ ?]+)\?[^\ ]* (?<req_ver>HTTP/[^ ]+)$$ "$$req_method $$req_path $$req_ver";
              default $$request;
          }
          log_format ws_no_query '$$remote_addr - $$remote_user [$$time_local] "$$request_no_query" '
                                 '$$status $$body_bytes_sent "$$http_referer" '
                                 '"$$http_user_agent" "$$http_x_forwarded_for"';

          access_log /var/log/nginx/access.log main;

          # 性能优化
          sendfile on;
          tcp_nopush on;
          tcp_nodelay on;
          keepalive_timeout 65;
          types_hash_max_size 2048;

          # Gzip 压缩
          gzip on;
          gzip_vary on;
          gzip_proxied any;
          gzip_comp_level 6;
          gzip_min_length 1024;
          gzip_types text/plain text/css text/xml application/json application/javascript
                     application/rss+xml application/atom+xml image/svg+xml;

          # 上游服务
          upstream api_backend {
              server api:8000;
              keepalive 32;
          }

          upstream frontend_backend {
              server api:3000;
              keepalive 16;
          }

          # ======== HTTP 服务器 ========
          server {
              listen 80;
              server_name _;
              return 301 https://$$host$$request_uri;
          }

          # ======== HTTPS 服务器 ========
          server {
              listen 443 ssl http2;
              server_name _;

              # SSL 证书配置（使用自签名证书示例）
              ssl_certificate /etc/nginx/ssl/server.crt;
              ssl_certificate_key /etc/nginx/ssl/server.key;

              # SSL 安全配置
              ssl_protocols TLSv1.2 TLSv1.3;
              ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
              ssl_prefer_server_ciphers off;
              ssl_session_cache shared:SSL:10m;
              ssl_session_timeout 1d;

              # 安全头
              server_tokens off;
              add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
              add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' ws: wss:" always;
              add_header X-Frame-Options "SAMEORIGIN" always;
              add_header X-Content-Type-Options "nosniff" always;
              add_header Referrer-Policy "strict-origin-when-cross-origin" always;

              # ======== 请求体大小上限（全局基线） ========
              # #586：client_max_body_size 此前只设在 location /api/v1/upload（100M），
              # /api/v1/export（应用侧上限 50MB）/export/pdf/skills/upload 落入
              # location /api/ 的 nginx 内置默认 1M —— 高清导出图在传输层就 413。
              # server 级全局基线与应用侧各路由上限对齐；/upload 的显式值保留作冗余。
              client_max_body_size 100M;

              # ======== 静态资源缓存（顶层 regex 匹配，必须在 location / 之前）========
              # 审计 P0：之前嵌套在 location / 内的 location ~* 被 nginx 忽略（嵌套
              # regex location 无效），导致静态资源永不过期缓存未生效。提取到 server 顶层。
              # #585：regex location 匹配优先级高于普通前缀 location /api/（/api/ 无
              # ^~ 修饰），任何以这些扩展名结尾的 API URI（导出下载 /api/v1/export/
              # download/*.png、静态文件 /api/v1/static/*）会被劫持到 frontend 404。
              # 用负向前瞻 ^(?!/api/) 把 /api/ 前缀排除在静态缓存外，交给 API 路由。

              # JS / CSS — 1 年强缓存
              location ~* ^(?!/api/).*\.(js|css)$$ {
                  proxy_pass http://frontend_backend;
                  proxy_http_version 1.1;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $$scheme;
                  expires 1y;
                  add_header Cache-Control "public, max-age=31536000, immutable" always;
                  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
                  add_header X-Content-Type-Options "nosniff" always;
              }

              # 图片 / 字体 / SVG — 1 年强缓存（#585：负向前瞻排除 /api/，见上文）
              location ~* ^(?!/api/).*\.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$$ {
                  proxy_pass http://frontend_backend;
                  proxy_http_version 1.1;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $$scheme;
                  expires 1y;
                  add_header Cache-Control "public, max-age=31536000, immutable" always;
                  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
                  add_header X-Content-Type-Options "nosniff" always;
              }

              # ======== 前端（SPA + Next.js standalone server）========
              # 不匹配上述 regex 的请求全部转发给 Node.js standalone server。
              location / {
                  proxy_pass http://frontend_backend;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $$http_upgrade;
                  proxy_set_header Connection $$connection_upgrade;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $$scheme;
                  proxy_cache_bypass $$http_upgrade;
              }

              # ======== API 路由 ========
              location /api/ {
                  proxy_pass http://api_backend;
                  proxy_http_version 1.1;
                  proxy_set_header Connection "";
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $$scheme;

                  # 超时配置（transport goal E-F-5）：普通 API 调用也可能较重
                  # （报告生成、重型工具 dispatch、非流式 /chat），60s 会把合法长
                  # 调用 504。提升到 300s（与 upload 一致）。SSE 流有独立 location
                  # 用 3600s。
                  proxy_connect_timeout 60s;
                  proxy_send_timeout 300s;
                  proxy_read_timeout 300s;

                  # CORS 头
                  add_header Access-Control-Allow-Origin $$allowed_origin always;
                  add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                  add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
                  add_header Access-Control-Allow-Credentials "true" always;
                  # 安全头（nginx add_header 会覆盖父级，必须重复）
                  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
                  add_header X-Frame-Options "SAMEORIGIN" always;
                  add_header X-Content-Type-Options "nosniff" always;
                  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

                  # 处理预检请求
                  if ($$request_method = 'OPTIONS') {
                      return 204;
                  }
              }

              # ======== SSE 流式端点（必须在 /api/ 之前匹配） ========
              # proxy_buffering 默认开启会把 SSE chunk 攒在 nginx 缓冲区里再批量下发，
              # 用户感受到的是"卡顿 + 一次性涌出"。关闭后才能逐 chunk 转发。
              location = /api/v1/chat/stream {
                  proxy_pass http://api_backend;
                  proxy_http_version 1.1;
                  proxy_set_header Connection "";
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $$scheme;

                  # 关键：SSE 必须关闭缓冲
                  proxy_buffering off;
                  proxy_cache off;
                  chunked_transfer_encoding on;
                  add_header X-Accel-Buffering no;

                  # 长连接：工具链可能跑数分钟
                  proxy_connect_timeout 10s;
                  proxy_send_timeout 3600s;
                  proxy_read_timeout 3600s;
              }

              # ======== Explorer SSE 流（transport goal E-F-1，P0 修复） ========
              # 之前的 regex `^/api/v1/stream/` 匹配不到任何真实路由（实际路由是
              # /api/v1/explorer/stream/{task_id}，explorer.py:15,90），导致 explorer
              # 的进度流落到 `location /api/`：proxy_buffering 默认 ON（chunk 攒到
              # ~32KB 才下发）+ proxy_read_timeout 60s（空闲>60s 直接 504）。修正为
              # 匹配真实路径，并同样关闭缓冲 / 拉长超时。
              location ~ ^/api/v1/explorer/stream/ {
                  proxy_pass http://api_backend;
                  proxy_http_version 1.1;
                  proxy_set_header Connection "";
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $$scheme;

                  proxy_buffering off;
                  proxy_cache off;
                  chunked_transfer_encoding on;
                  add_header X-Accel-Buffering no;

                  proxy_connect_timeout 10s;
                  proxy_send_timeout 3600s;
                  proxy_read_timeout 3600s;
              }

              # ======== 上传文件 ========
              location /api/v1/upload {
                  proxy_pass http://api_backend;
                  proxy_http_version 1.1;
                  proxy_set_header Connection "";
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;

                  # 大文件上传配置
                  client_max_body_size 100M;
                  proxy_connect_timeout 300s;
                  proxy_send_timeout 300s;
                  proxy_read_timeout 300s;
              }

              # ======== WebSocket 支持 ========
              # #757: WS 握手 URL 可能携带 ?token=<JWT>（兼容回退），$$request 含
              # 完整 query —— 用去掉 query 的请求行记录，避免活体 JWT 落盘。
              location /ws/ {
                  access_log /var/log/nginx/access.log ws_no_query;
                  proxy_pass http://api_backend;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $$http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_read_timeout 86400s;
              }

              # ======== 健康检查端点 ========
              location /health {
                  access_log off;
                  return 200 "healthy\n";
                  add_header Content-Type text/plain;
                  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
                  add_header X-Frame-Options "SAMEORIGIN" always;
                  add_header X-Content-Type-Options "nosniff" always;
              }

              # ======== 错误页面 ========
              error_page 500 502 503 504 /50x.html;
              location = /50x.html {
                  root /usr/share/nginx/html;
              }
          }
      }
