# GIS Core Skills — Remote Sensing（ADR-0182）
# 注意：这些技能描述 Harness 作业过程（结果处理与制图），不实现新遥感算法；
# 算法能力缺席时标记 capability missing，不伪造结果。
skills:
  - id: landcover_result_mapping
    name: 地表覆盖结果制图
    description: 分类结果（已分类栅格/矢量）的制图表达：类别体系核对、面积账目、分类配色；不做重新分类计算。
    domain: remote_sensing
    pack: core
    version: 1.0.0
    intent_patterns: [土地利用, 地表覆盖, 分类结果, land cover, land use, classification result]
    ontology_tasks: [remote_sensing.classification]
    task_types: [raster_distribution]
    when_to_use: 已有覆盖/分类结果需要制图与面积账目。
    when_not_to_use: 需要从原始影像做监督分类（能力面任务，标记 missing）。
    required_situation:
      geometry_kinds: [raster, polygon]
      data_roles: [subject]
    capability_requirements:
      - capability_id: raster_reclassify
        purpose: 类别代号规整（可选）
        criticality: optional
        hard_gate: false
      - capability_id: zonal_statistics
        purpose: 面积账目（分区可选）
        criticality: optional
        hard_gate: false
      - capability_id: thematic_cartography
        purpose: 分类制图
        criticality: required
        hard_gate: true
    input_roles: [subject]
    output_roles: [subject]
    output_artifacts: [raster_surface, polygon_feature_set, stats_table]
    recipe_refs: [landcover_change_inventory]
    procedure:
      steps:
        - step_id: verify_class_schema
          title: 类别体系核对
          kind: inspect
          description: 类别代号/名称/体系版本核对；体系未知必须披露。
          evidence_requirements:
            - evidence_kind: class_schema_declaration
        - step_id: area_accounting
          title: 面积账目
          kind: analyze
          description: 各类面积与占比（投影 CRS）。
          evidence_requirements:
            - evidence_kind: area_accounting_report
        - step_id: categorical_design
          title: 分类配色与表达
          kind: design
          description: 惯例配色（耕地/林/水…）+ 图例完整。
          evidence_requirements:
            - evidence_kind: map_expression
        - step_id: disclose_provenance
          title: 来源与期次披露
          kind: validate
          description: 数据源、分辨率、分类时间披露。
          evidence_requirements:
            - evidence_kind: provenance_disclosure
      requirements:
        - node_id: req_result_present
          requirement_kind: data_role
          value: subject
          reason_code: DATA_ROLE_MISSING_SUBJECT
          on_fail: reject
      evidence_nodes:
        - node_id: ev_schema
          evidence_kind: class_schema_declaration
        - node_id: ev_area
          evidence_kind: area_accounting_report
        - node_id: ev_map
          evidence_kind: map_expression
        - node_id: ev_prov
          evidence_kind: provenance_disclosure
      fallbacks:
        - node_id: fb_unknown_schema
          trigger: quality_failure
          action: methodology_note
          reason_code: CLASS_SCHEMA_UNKNOWN
          disclosure: 类别体系未知：按代号表达并披露局限。
        - node_id: fb_missing_input
          trigger: missing_input
          action: clarify
          reason_code: INPUT_MISSING
          disclosure: 缺少本技能必需的输入数据：向用户确认数据后再继续，不猜测。
        - node_id: fb_unsupported_geometry
          trigger: unsupported_geometry
          action: blocked
          reason_code: GEOMETRY_NOT_SUPPORTED
          disclosure: 数据几何不属于本技能的支持范围：不强行执行，说明支持的几何类别。
        - node_id: fb_insufficient_data
          trigger: insufficient_data
          action: reduced_output
          reason_code: INSUFFICIENT_DATA
          disclosure: 样本/覆盖不足：仅产出描述性结果并显式披露局限，不做推断性结论。
    statistical_semantics:
      measure_semantics: [area_share, count]
      normalization: 面积账目在投影 CRS 下；占比分母=有效分类面积（NoData 扣除并披露）。
      denominator_required: true
    geographic_semantics:
      scope_unit: unknown
      analysis_unit: raster_cell
      aggregation_unit: ""
      display_unit: [raster_cell]
    temporal_semantics:
      temporal_mode: snapshot
    quality_obligations:
      - obligation_id: class_system_declared
        obligation_kind: procedure
        description: 类别体系版本显式。
        evidence_kind: class_schema_declaration
      - obligation_id: source_and_date
        obligation_kind: disclosure
        description: 来源/分辨率/期次披露。
        evidence_kind: provenance_disclosure
    fallback_policy:
      - trigger: quality_failure
        downgrade_class: degraded
        disclosure: 体系未知时降级表达并披露。
    completion_evidence: [class_schema_declaration, area_accounting_report, map_expression, provenance_disclosure]
    product_requirements: [title, legend, attribution]
    examples:
      - title: 土地利用现状图
        query: 土地利用分类结果制图
        notes: 结果制图 + 面积账目。
    guidance: 结果制图三件套：类别体系、面积账目、来源期次。
    source_doc: docs/adr/0182-gis-skill-procedure-library-v1.md

  - id: change_detection_mapping
    name: 变化检测制图
    description: 两期数据变化结果（已算得的变化层）的制图与面积账目；两期可比性义务强制。
    domain: remote_sensing
    pack: core
    version: 1.0.0
    intent_patterns: [变化检测, 变化, 扩张, 新增, 消失, change detection, change, loss gain]
    ontology_tasks: [remote_sensing.change_detection, cartographic.comparison_map]
    task_types: [change_detection]
    when_to_use: 已有两期数据/变化结果需要制图表达与账目。
    when_not_to_use: 单期现状（用 landcover_result_mapping）。
    required_situation:
      geometry_kinds: [raster, polygon]
      data_roles: [baseline, target_time]
    optional_situation:
      data_roles: [comparison_time]
    capability_requirements:
      - capability_id: change_detection
        purpose: 变化层计算（能力在场时）
        criticality: optional
        hard_gate: false
      - capability_id: raster_change_detection
        purpose: 栅格变化
        criticality: optional
        hard_gate: false
      - capability_id: zonal_statistics
        purpose: 变化面积账目
        criticality: optional
        hard_gate: false
      - capability_id: thematic_cartography
        purpose: 变化制图
        criticality: required
        hard_gate: true
    input_roles: [baseline, target_time]
    output_roles: [subject]
    output_artifacts: [change_set, stats_table]
    recipe_refs: [bitemporal_raster_change, change_area_accounting, optical_bitemporal_change]
    procedure:
      steps:
        - step_id: comparability_check
          title: 两期可比性核查
          kind: inspect
          description: 范围一致/类别体系兼容/数据源可比；任一不满足必须披露。
          evidence_requirements:
            - evidence_kind: comparability_report
        - step_id: change_computation
          title: 变化层获取
          kind: analyze
          description: 能力在场则计算；结果已给则核对语义（增益/损失/净变化）。
          evidence_requirements:
            - evidence_kind: change_semantics_declaration
        - step_id: change_accounting
          title: 变化面积账目
          kind: analyze
          description: 转移矩阵/净变化面积。
          evidence_requirements:
            - evidence_kind: area_accounting_report
        - step_id: change_cartography
          title: 变化制图
          kind: design
          description: 增/损双色惯例 + 期次标注。
          evidence_requirements:
            - evidence_kind: map_expression
      decisions:
        - node_id: change_semantics_choice
          question: 表达哪种变化语义？
          default_option_id: net_change
          decided_by: [goal_text]
          options:
            - option_id: net_change
              condition: 关心净增减
              then_step_ids: [change_accounting]
            - option_id: transfers
              condition: 关心类别间转移
              then_step_ids: [change_accounting]
      requirements:
        - node_id: req_two_periods
          requirement_kind: temporal_mode
          value: comparison
          reason_code: TEMPORAL_MODE_MISMATCH
          on_fail: reject
      evidence_nodes:
        - node_id: ev_comp
          evidence_kind: comparability_report
        - node_id: ev_sem
          evidence_kind: change_semantics_declaration
        - node_id: ev_area
          evidence_kind: area_accounting_report
        - node_id: ev_map
          evidence_kind: map_expression
      fallbacks:
        - node_id: fb_single_period
          trigger: missing_input
          action: reduced_output
          reason_code: SINGLE_PERIOD_ONLY
          disclosure: 仅单期：只做现状表达，不做变化结论。
        - node_id: fb_incomparable
          trigger: quality_failure
          action: methodology_note
          reason_code: COMPARABILITY_UNMET
          disclosure: 两期口径不一致：变化结论附系统误差说明。
        - node_id: fb_unsupported_geometry
          trigger: unsupported_geometry
          action: blocked
          reason_code: GEOMETRY_NOT_SUPPORTED
          disclosure: 数据几何不属于本技能的支持范围：不强行执行，说明支持的几何类别。
        - node_id: fb_insufficient_data
          trigger: insufficient_data
          action: reduced_output
          reason_code: INSUFFICIENT_DATA
          disclosure: 样本/覆盖不足：仅产出描述性结果并显式披露局限，不做推断性结论。
    statistical_semantics:
      measure_semantics: [area_share, count]
      normalization: 变化面积以投影 CRS 面积计；占比分母=研究区有效面积。
      denominator_required: true
    geographic_semantics:
      scope_unit: unknown
      analysis_unit: raster_cell
      aggregation_unit: ""
      display_unit: [raster_cell]
    temporal_semantics:
      temporal_mode: comparison
      min_periods: 2
      comparability: [same_extent, compatible_classes, comparable_source, time_labeling, change_semantics]
    quality_obligations:
      - obligation_id: comparability_mandatory
        obligation_kind: procedure
        description: 两期可比性核查不得跳过。
        evidence_kind: comparability_report
      - obligation_id: period_labeling
        obligation_kind: disclosure
        description: 图面必须标注两期时点。
        evidence_kind: map_expression
    fallback_policy:
      - trigger: missing_input
        downgrade_class: proxy
        disclosure: 单期降级并披露。
      - trigger: quality_failure
        downgrade_class: approximation
        disclosure: 口径差异时近似结论+误差披露。
    completion_evidence: [comparability_report, change_semantics_declaration, area_accounting_report, map_expression]
    product_requirements: [title, legend, attribution]
    examples:
      - title: 近十年耕地变化
        query: 2015 vs 2025 耕地变化
        notes: 可比性先行；转移账目可选。
    guidance: 变化结论的强度取决于两期可比性——先核查再制图。
    source_doc: docs/adr/0182-gis-skill-procedure-library-v1.md

  - id: time_series_result_mapping
    name: 时序结果制图
    description: 多期时序结果（趋势/季节/断点）的制图表达；期数门槛与时间标注义务。
    domain: remote_sensing
    pack: core
    version: 1.0.0
    intent_patterns: [时序, 趋势, 逐年, 季节, ndvi时序, time series, trend, seasonal]
    ontology_tasks: [remote_sensing.temporal_analysis, sar.temporal_analysis]
    task_types: [temporal_trend, vegetation_index]
    when_to_use: ≥3 期数据的趋势/季节表达。
    when_not_to_use: 两期对比（用 change_detection_mapping）。
    required_situation:
      geometry_kinds: [raster, point, table]
      data_roles: [subject]
    capability_requirements:
      - capability_id: temporal_trend
        purpose: 趋势计算（能力在场时）
        criticality: optional
        hard_gate: false
      - capability_id: temporal_composite
        purpose: 时序合成
        criticality: optional
        hard_gate: false
      - capability_id: report_charting
        purpose: 时序图表
        criticality: required
        hard_gate: true
      - capability_id: thematic_cartography
        purpose: 趋势制图
        criticality: required
        hard_gate: true
    input_roles: [subject, baseline, target_time]
    output_roles: [subject]
    output_artifacts: [chart_spec, raster_surface, stats_table]
    recipe_refs: []
    procedure:
      steps:
        - step_id: period_inventory
          title: 期数清点
          kind: inspect
          description: 期数/时间戳/缺口盘点；trend 需 ≥3 期。
          evidence_requirements:
            - evidence_kind: period_inventory
        - step_id: trend_gate
          title: 趋势门槛核查
          kind: validate
          description: 期数/观测密度满足趋势前提；否则降级为分年展示。
          evidence_requirements:
            - evidence_kind: trend_eligibility
        - step_id: series_charting
          title: 时序图表
          kind: design
          description: 折线/季节分解图。
          evidence_requirements:
            - evidence_kind: chart_specification
        - step_id: trend_map
          title: 趋势地图
          kind: design
          description: 斜率/显著性空间表达（能力在场时）。
          required: false
          skip_policy: if_unavailable
          evidence_requirements:
            - evidence_kind: map_expression
      decisions:
        - node_id: series_focus
          question: 趋势、季节还是分年展示？
          default_option_id: yearly_display
          decided_by: [period_count, goal_text]
          options:
            - option_id: yearly_display
              condition: 期数少或缺口大
              then_step_ids: [series_charting]
            - option_id: trend_analysis
              condition: 期数充足
              then_step_ids: [trend_gate, series_charting]
      requirements:
        - node_id: req_time_field
          requirement_kind: data_role
          value: target_time
          reason_code: TIME_FIELD_MISSING
          on_fail: reject
      evidence_nodes:
        - node_id: ev_periods
          evidence_kind: period_inventory
        - node_id: ev_gate
          evidence_kind: trend_eligibility
        - node_id: ev_chart
          evidence_kind: chart_specification
        - node_id: ev_map
          evidence_kind: map_expression
          required: false
      fallbacks:
        - node_id: fb_few_periods
          trigger: insufficient_data
          action: reduced_output
          reason_code: INSUFFICIENT_PERIODS
          disclosure: 期数不足：分年展示替代趋势结论。
        - node_id: fb_compare_instead
          trigger: insufficient_data
          action: alternative_skill
          fallback_skill_id: temporal_comparison_workflow
          reason_code: INSUFFICIENT_PERIODS
          disclosure: 期数不足以做趋势：若有两期可改走两期对比。
        - node_id: fb_missing_input
          trigger: missing_input
          action: clarify
          reason_code: INPUT_MISSING
          disclosure: 缺少本技能必需的输入数据：向用户确认数据后再继续，不猜测。
        - node_id: fb_unsupported_geometry
          trigger: unsupported_geometry
          action: blocked
          reason_code: GEOMETRY_NOT_SUPPORTED
          disclosure: 数据几何不属于本技能的支持范围：不强行执行，说明支持的几何类别。
    statistical_semantics:
      measure_semantics: [mean, rate]
      normalization: 趋势斜率单位（每 年）显式。
      denominator_required: false
    geographic_semantics:
      scope_unit: unknown
      analysis_unit: raster_cell
      aggregation_unit: ""
      display_unit: [raster_cell, unknown]
    temporal_semantics:
      temporal_mode: trend
      min_periods: 3
      comparability: [comparable_source, time_labeling]
    quality_obligations:
      - obligation_id: time_axis_labeled
        obligation_kind: disclosure
        description: 时间轴/期次标注义务。
        evidence_kind: chart_specification
    fallback_policy:
      - trigger: insufficient_data
        downgrade_class: proxy
        disclosure: 分年展示替代趋势。
    completion_evidence: [period_inventory, trend_eligibility, chart_specification]
    product_requirements: [title, legend, chart_panel, attribution]
    examples:
      - title: NDVI 年际趋势
        query: 近十年 ndvi 趋势
        notes: ≥3 期才谈趋势。
    guidance: 趋势=统计结论，期数门槛先过。
    source_doc: docs/adr/0182-gis-skill-procedure-library-v1.md

  - id: sar_result_interpretation_mapping
    name: SAR 结果解译制图
    description: SAR 产品（后向散射/相干/形变结果）的解译表达链：定标语义披露 + 去噪状态 + 制图；未定标不得进解译层。
    domain: remote_sensing
    pack: core
    version: 1.0.0
    intent_patterns: [sar, 雷达, insar, 形变, 相干, backscatter, coherence, deformation]
    ontology_tasks: [sar.interpretation, sar.radiometric_calibration, sar.speckle_filtering]
    task_types: [sar_analysis]
    when_to_use: SAR 处理结果/产品的表达与解译报告。
    when_not_to_use: 光学影像变化（用 change_detection_mapping）。
    required_situation:
      geometry_kinds: [raster]
      data_roles: [subject]
    capability_requirements:
      - capability_id: sar_radiometric_calibration
        purpose: 辐射定标（解译前提）
        criticality: optional
        hard_gate: false
      - capability_id: sar_speckle_filtering
        purpose: 去噪
        criticality: optional
        hard_gate: false
      - capability_id: sar_coherence
        purpose: 相干性产品
        criticality: optional
        hard_gate: false
      - capability_id: sar_analysis
        purpose: SAR 分析面
        criticality: optional
        hard_gate: false
      - capability_id: thematic_cartography
        purpose: SAR 制图
        criticality: required
        hard_gate: true
    input_roles: [subject]
    output_roles: [subject]
    output_artifacts: [raster_surface, change_set]
    recipe_refs: [sar_backscatter_overview, sar_calibrated_comparison]
    procedure:
      steps:
        - step_id: calibration_status
          title: 定标状态核查
          kind: inspect
          description: 定标/几何校正状态；未定标 → 相对解译披露。
          evidence_requirements:
            - evidence_kind: calibration_status_report
        - step_id: speckle_status
          title: 去噪状态核查
          kind: inspect
          description: 滤波状态与参数披露。
          evidence_requirements:
            - evidence_kind: preprocessing_status
        - step_id: interpret_chain
          title: 解译表达链
          kind: design
          description: 后向散射/相干/形变的分层表达与解译注释。
          evidence_requirements:
            - evidence_kind: map_expression
        - step_id: limitations_disclosure
          title: 局限披露
          kind: validate
          description: 定标/叠掩/阴影局限披露。
          evidence_requirements:
            - evidence_kind: provenance_disclosure
      decisions:
        - node_id: calibration_gate
          question: 已定标才进定量解译？
          default_option_id: relative_interpretation
          decided_by: [calibration_status]
          options:
            - option_id: relative_interpretation
              condition: 未定标（缺参）
              then_step_ids: [interpret_chain]
            - option_id: quantitative_interpretation
              condition: 已定标
              then_step_ids: [interpret_chain]
      evidence_nodes:
        - node_id: ev_cal
          evidence_kind: calibration_status_report
        - node_id: ev_prep
          evidence_kind: preprocessing_status
        - node_id: ev_map
          evidence_kind: map_expression
        - node_id: ev_prov
          evidence_kind: provenance_disclosure
      fallbacks:
        - node_id: fb_uncalibrated
          trigger: quality_failure
          action: methodology_note
          reason_code: UNCALIBRATED
          disclosure: 未定标：仅相对解译，不做定量结论。
        - node_id: fb_missing_input
          trigger: missing_input
          action: clarify
          reason_code: INPUT_MISSING
          disclosure: 缺少本技能必需的输入数据：向用户确认数据后再继续，不猜测。
        - node_id: fb_unsupported_geometry
          trigger: unsupported_geometry
          action: blocked
          reason_code: GEOMETRY_NOT_SUPPORTED
          disclosure: 数据几何不属于本技能的支持范围：不强行执行，说明支持的几何类别。
        - node_id: fb_insufficient_data
          trigger: insufficient_data
          action: reduced_output
          reason_code: INSUFFICIENT_DATA
          disclosure: 样本/覆盖不足：仅产出描述性结果并显式披露局限，不做推断性结论。
    statistical_semantics:
      measure_semantics: [index, mean]
      normalization: 后向散射单位（dB/σ°）声明。
      denominator_required: false
    geographic_semantics:
      scope_unit: unknown
      analysis_unit: raster_cell
      aggregation_unit: ""
      display_unit: [raster_cell]
    temporal_semantics:
      temporal_mode: snapshot
    quality_obligations:
      - obligation_id: calibration_disclosed
        obligation_kind: procedure
        description: 定标状态必须披露。
        evidence_kind: calibration_status_report
      - obligation_id: geometry_artifacts_disclosed
        obligation_kind: disclosure
        description: 叠掩/阴影/透视收缩局限披露。
        evidence_kind: provenance_disclosure
    fallback_policy:
      - trigger: quality_failure
        downgrade_class: approximation
        disclosure: 未定标相对解译。
    completion_evidence: [calibration_status_report, preprocessing_status, map_expression, provenance_disclosure]
    product_requirements: [title, legend, attribution]
    examples:
      - title: SAR 变化检测结果制图
        query: sar变化检测结果制图
        notes: 定标状态披露先行。
    guidance: SAR 解译链：定标 → 去噪 → 解译；状态披露不可省。
    source_doc: docs/adr/0182-gis-skill-procedure-library-v1.md
