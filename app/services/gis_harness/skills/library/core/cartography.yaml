      - capability_id: thematic_cartography
        purpose: 制图执行
        criticality: required
        hard_gate: true
      - capability_id: report_charting
        purpose: 图表面板
        criticality: optional
        hard_gate: false
    input_roles: [subject]
    output_roles: []
    output_artifacts: [chart_spec]
    recipe_refs: []
    procedure:
      steps:
        - step_id: panel_plan
