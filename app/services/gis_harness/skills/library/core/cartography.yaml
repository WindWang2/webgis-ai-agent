  - id: publication_map_design
    name: 出版图设计
    description: 出版级地图设计：精度元数据、完整制图要素（比例尺/指北针/坐标系注记）与导出规范。
    domain: cartography
    pack: core
    version: 1.0.0
    intent_patterns: [出版, 印刷, 论文, 打印, 报告图, publication, print, journal]
    ontology_tasks: [cartographic.report_map]
    task_types: [simple_view]
    when_to_use: 交付目标是印刷/论文/正式报告。
    when_not_to_use: 屏幕快照需求。
    required_situation:
      geometry_kinds: [polygon, point, raster, line]
      data_roles: [subject]
    capability_requirements:
      - capability_id: thematic_cartography
        purpose: 制图执行
        criticality: required
        hard_gate: true
      - capability_id: map_export_publishing
        purpose: 高保真导出
        criticality: required
        hard_gate: true
    input_roles: [subject]
    output_roles: []
    output_artifacts: [chart_spec]
    recipe_refs: []
    procedure:
      steps:
        - step_id: export_spec
          title: 导出规范确认
          kind: inspect
          description: 尺寸/DPI/色彩空间/格式。
          evidence_requirements:
            - evidence_kind: export_specification
        - step_id: full_elements
          title: 制图要素完备
          kind: design
          description: 标题/图例/比例尺/指北针/坐标系/来源全备。
          evidence_requirements:
            - evidence_kind: product_completeness
        - step_id: export_verify
          title: 导出核验
          kind: validate
          description: 导出物与期望一致（页数/尺寸/清晰度）。
          evidence_requirements:
            - evidence_kind: export_verification
      decisions:
        - node_id: color_mode
          question: 彩印还是灰度安全？
