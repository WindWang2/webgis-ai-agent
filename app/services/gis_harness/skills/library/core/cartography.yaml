          evidence_requirements:
            - evidence_kind: panel_plan_record
        - step_id: shared_legend
          title: 共用图例裁决
          kind: decide
          description: 同变量共用图例；异变量各自标注。
        - step_id: compose_panels
          title: 组合版面
          kind: design
          description: AC-V11 版面求解执行。
