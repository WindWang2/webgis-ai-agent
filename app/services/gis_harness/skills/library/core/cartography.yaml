      geometry_kinds: [polygon, point, raster, line]
      data_roles: [subject]
    capability_requirements:
      - capability_id: thematic_cartography
        purpose: 制图执行
        criticality: required
        hard_gate: true
      - capability_id: map_export_publishing
        purpose: 批量导出
        criticality: optional
        hard_gate: false
    input_roles: [subject]
    output_roles: []
    output_artifacts: [chart_spec]
    recipe_refs: []
    procedure:
      steps:
        - step_id: page_inventory
          title: 页面清单
          kind: inspect
          description: 页序/范围/主题清单。
          evidence_requirements:
            - evidence_kind: page_inventory_record
        - step_id: unified_template
