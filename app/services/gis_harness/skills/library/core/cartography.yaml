        - node_id: fb_missing_input
          trigger: missing_input
          action: clarify
          reason_code: INPUT_MISSING
          disclosure: 缺少本技能必需的输入数据：向用户确认数据后再继续，不猜测。
        - node_id: fb_unsupported_geometry
          trigger: unsupported_geometry
          action: blocked
          reason_code: GEOMETRY_NOT_SUPPORTED
          disclosure: 数据几何不属于本技能的支持范围：不强行执行，说明支持的几何类别。
    statistical_semantics:
      measure_semantics: [count]
      denominator_required: false
    geographic_semantics:
      scope_unit: unknown
      analysis_unit: unknown
      aggregation_unit: ""
      display_unit: [unknown]
    temporal_semantics:
      temporal_mode: snapshot
    quality_obligations:
      - obligation_id: cross_page_consistency
        obligation_kind: procedure
        description: 跨页一致性义务。
        evidence_kind: consistency_audit_record
    fallback_policy:
      - trigger: insufficient_data
        downgrade_class: degraded
        disclosure: 缺页披露。
    completion_evidence: [page_inventory_record, map_expression, consistency_audit_record]
    product_requirements: [title, legend, attribution]
    examples:
      - title: 区县图集
        query: 各区县一页一张图
        notes: 模板统一 + 一致性审计。
    guidance: 图集卖的是一致性，不是单页惊艳。
