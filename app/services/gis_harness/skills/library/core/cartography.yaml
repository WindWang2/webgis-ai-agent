              then_step_ids: [full_elements]
            - option_id: grayscale_safe
              condition: 灰度打印
              then_step_ids: [full_elements]
      evidence_nodes:
        - node_id: ev_spec
          evidence_kind: export_specification
        - node_id: ev_product
          evidence_kind: product_completeness
        - node_id: ev_verify
          evidence_kind: export_verification
      fallbacks:
        - node_id: fb_export_fail
          trigger: provider_unavailable
          action: reduced_output
          reason_code: EXPORT_UNAVAILABLE
          disclosure: 高保真导出不可用：交付屏幕级产物并披露。
        - node_id: fb_missing_input
          trigger: missing_input
          action: clarify
          reason_code: INPUT_MISSING
          disclosure: 缺少本技能必需的输入数据：向用户确认数据后再继续，不猜测。
        - node_id: fb_unsupported_geometry
          trigger: unsupported_geometry
          action: blocked
          reason_code: GEOMETRY_NOT_SUPPORTED
          disclosure: 数据几何不属于本技能的支持范围：不强行执行，说明支持的几何类别。
        - node_id: fb_insufficient_data
          trigger: insufficient_data
          action: reduced_output
          reason_code: INSUFFICIENT_DATA
          disclosure: 样本/覆盖不足：仅产出描述性结果并显式披露局限，不做推断性结论。
    statistical_semantics:
      measure_semantics: [count]
      denominator_required: false
    geographic_semantics:
      scope_unit: unknown
      analysis_unit: unknown
      aggregation_unit: ""
      display_unit: [unknown]
    temporal_semantics:
      temporal_mode: snapshot
    quality_obligations:
      - obligation_id: elements_complete
        obligation_kind: procedure
        description: 出版要素完备性义务。
        evidence_kind: product_completeness
    fallback_policy:
      - trigger: provider_unavailable
        downgrade_class: degraded
        disclosure: 降级导出并披露。
    completion_evidence: [export_specification, product_completeness, export_verification]
    product_requirements: [title, legend, scale_bar, north_arrow, attribution]
    examples:
      - title: 论文插图
        query: 论文用 300dpi 的图
        notes: 全要素 + 导出核验。
    guidance: 出版图以导出核验收口，不止于「看起来对」。
