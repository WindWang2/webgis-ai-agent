# GIS Skill Benchmark Corpus v1（ADR-0182 / goal S24）
#
# 审定资产：确定性 resolver 评测语料；修改走 code review。
# 字段：id 唯一 | q 目标文本 | lang zh/en | cat 类别 | cx 复杂度
#       facts SelectionFacts 附加字段（可选；意图层在生产中供给）
#       expect:
#         {type: select, top: <skill>}                    — top1 命中
#         {type: select, top: <skill>, in_top3: [...]}    — top3 放宽
#         {type: clarification}                            — 期望澄清
#         {type: reject, skill: <skill>, reason: <prefix>, fallback_to: <skill>} — 期望拒绝
#         {type: composition, composition: <id>}          — 组合解析（top1=primary）
