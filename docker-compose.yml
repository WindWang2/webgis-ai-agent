# docker-compose.yml
services:
  db:
    image: postgis/postgis:15-3.4@sha256:3f4a5d48e0be9580ed70ed618cd039ce57bbb2dd113053d3836e28513f1f87cd
    container_name: webgis-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-webgis}
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 1g
          cpus: "0.5"

  redis:
    image: redis:7-alpine@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7
    container_name: webgis-redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    # 审计 P1：开发环境也拒绝弱默认密码。之前 dev_redis_pass 硬编码且多处重复。
    # Dev Redis is cache-only (allkeys-lru). Prod/k8s use noeviction — see
    # docs/DEPLOYMENT.md "Redis 驱逐策略". Do not "fix" this to noeviction.
    # #1676（SEC-04）：`--requirepass ${REDIS_PASSWORD}` 从 command 移除 ——
    # compose 在解析期插值并把结果存进容器 Config.Cmd，`docker inspect` 直接
    # 打印明文；`docker top` / 宿主机 /proc/<pid>/cmdline 同样可见。改为入口
    # 把完整配置（含 requirepass）写进 /dev/shm tmpfs 的 0400 运行时 conf
    # （不落盘、容器停止即消失）后 exec redis-server，并保留 stock entrypoint
    # 的 root→redis 降权（gosu）与 /data chown。$$ 双写让 compose 不展开，
    # 运行时由容器 shell 从 env 读取。
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        umask 077
        printf 'appendonly yes\nmaxmemory 256mb\nmaxmemory-policy allkeys-lru\nbind 0.0.0.0\nrequirepass %s\n' "$$REDIS_PASSWORD" > /dev/shm/redis-runtime.conf
        chmod 400 /dev/shm/redis-runtime.conf
        if [ "$(id -u)" = '0' ] && command -v gosu >/dev/null 2>&1; then
          find /data \! -user redis -exec chown redis '{}' +
          chown redis:redis /dev/shm/redis-runtime.conf
          exec gosu redis redis-server /dev/shm/redis-runtime.conf
        fi
        exec redis-server /dev/shm/redis-runtime.conf
    environment:
      # 审计 P1：`:?` 缺值即拒绝启动（绝不引导无认证实例）。
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
      # 审计 P0：healthcheck 不直接暴露密码。通过 REDISCLI_AUTH 环境变量传递，
      # 避免密码出现在 docker inspect 的 healthcheck 命令中。
      REDISCLI_AUTH: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
        reservations:
          memory: 256m
          cpus: "0.25"

  api:
    build:
      context: .
      target: backend-builder
    container_name: webgis-api
    ports:
      # 审计 P2：无鉴权 API / metrics 不应暴露给局域网（db/redis 已限 127.0.0.1）。
      - "127.0.0.1:${API_PORT:-18000}:8000"
    environment:
      # Settings only reads DATABASE_URL (no DB_HOST field). Pin to the
      # compose `db` service so api/celery do not inherit host-side sqlite
      # from .env and concurrently write one SQLite file (#618-32).
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/${DB_NAME:-webgis}
      # audit #853: dev compose 无 alembic 步骤 —— 冷启动建表靠 create_all
      # （显式启用；prod 镜像走 alembic entrypoint，门控保持关闭）。
      - ALLOW_CREATE_ALL_ON_POSTGRES=1
      # Redis 配置
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@${REDIS_HOST:-redis}:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@${REDIS_HOST:-redis}:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@${REDIS_HOST:-redis}:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # 审计 I17 / INF-001：bind-mount ./app 让开发热重载方便，但会覆盖镜像代码。
      # 改为显式 opt-in：设置 WEBGIS_DEV_MOUNT=./app 启用，默认不挂载。
      ${WEBGIS_DEV_MOUNT:+- ${WEBGIS_DEV_MOUNT}:/app/app}
      - uploads:/app/data
    env_file:
      - .env
    # #1694 SEC-13：--ws-max-size 与 app/api/routes/ws.py:29 / ws_collab.py:51 的
    # _MAX_INBOUND_BYTES=16*1024 对齐 —— 应用层检查发生在整帧 receive_text()
    # 缓冲之后，协议层先限size 才不会把超大帧整体读进内存。
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --ws-max-size 16384
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
        reservations:
          memory: 512m
          cpus: "0.25"

  celery-worker:
    build: .
    container_name: webgis-celery
    environment:
      # Same PostGIS URL as api (Settings reads DATABASE_URL only; #618-32).
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/${DB_NAME:-webgis}
      # audit #853: dev compose 无 alembic 步骤 —— 冷启动建表靠 create_all
      # （显式启用；prod 镜像走 alembic entrypoint，门控保持关闭）。
      - ALLOW_CREATE_ALL_ON_POSTGRES=1
      - WEBGIS_ROLE=worker
      # Redis 配置
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@${REDIS_HOST:-redis}:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@${REDIS_HOST:-redis}:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # #471（#394 的 compose 兄弟项）：celery 任务按本地路径打开 api 写入的
    # 上传文件（run_ndvi_analysis → rasterio.open(raster_path)）。worker 在
    # 独立容器/独立文件系统层里，不挂同一个卷就只能看到空的容器层目录 ——
    # 上传成功的 raster 分析在 worker 侧"No such file"。与 api 挂同一个
    # uploads 卷；dev 栈 DATA_DIR 默认 ./data → 上传落在 /app/data/uploads。
    # （与 api 服务结构一致：WEBGIS_DEV_MOUNT 展开后紧跟固定挂载项。）
    volumes:
      # 审计 INF-003：bind-mount 改为显式 opt-in，与 api 服务一致。
      ${WEBGIS_DEV_MOUNT:+- ${WEBGIS_DEV_MOUNT}:/app/app}
      - uploads:/app/data
    env_file:
      - .env
    # GeoCompute V5 异构队列（audit 06 §6.1 step 1）：task_queue.py 声明了
    # 每 profile 一个具名队列（light_cpu/heavy_cpu/high_memory/raster/
    # network/external_io，命名 {profile}_queue）+ 默认队列 celery。
    # 单 worker 部署语义不变（CRITICAL）：本 worker 用 -Q 显式消费**全部**
    # 队列 —— 路由真相就位但物理放置不变。要按 profile 拆 worker 时，复制
    # 本服务并把 -Q 收窄为对应子集即可（例如 raster worker 只取
    # `-Q celery,raster_queue`，并按需调大其内存/cpus 预留）。
    # Redis 缺席（task_always_eager）时队列不参与路由，行为与单机模式一致。
    command: >
      celery -A app.services.task_queue worker -l info
      -Q celery,light_cpu_queue,heavy_cpu_queue,high_memory_queue,raster_queue,network_queue,external_io_queue
    healthcheck:
      # 审计 INF-003：celery-worker 缺少 healthcheck，depends_on 无法等待就绪。
      test: ["CMD-SHELL", "celery -A app.services.task_queue inspect ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
        reservations:
          memory: 512m
          cpus: "0.25"

volumes:
  pg_data:
  redis_data:
  uploads: